<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playvolution</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --bg-panel: rgba(10,10,10,0.92);
            --text: #d4d4c8;
            --text-dim: #8a8a7a;
            --text-faint: #5a5a50;
            --accent: #c8a060;
            --cosmic: #b8a8c8;
            --quantum: #a8b8c8;
            --entropiric: #c8a8a0;
            --border: rgba(200,160,96,0.15);
            --border-bright: rgba(200,160,96,0.35);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 18px;
            line-height: 1.7;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== FULLSCREEN LAYERS ===== */
        #scene {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: background 2s ease;
        }

        .scene-room { background: linear-gradient(180deg, #0d0d14 0%, #0a0a0a 40%, #121210 100%); }
        .scene-chat { background: linear-gradient(180deg, #0a0d14 0%, #0a0a0a 40%, #0d1210 100%); }
        .scene-history { background: linear-gradient(180deg, #1a1410 0%, #0a0a0a 40%, #14100d 100%); }
        .scene-cosmic { background: linear-gradient(180deg, #140d1a 0%, #0a0a0a 40%, #0d1014 100%); }
        .scene-quantum { background: linear-gradient(180deg, #0d141a 0%, #0a0a0a 40%, #101014 100%); }
        .scene-crisis { background: linear-gradient(180deg, #1a0d0d 0%, #0a0a0a 40%, #141010 100%); }
        .scene-ending { background: linear-gradient(180deg, #0d1a14 0%, #0a0a0a 50%, #14100d 100%); }

        #vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
        }

        /* p5.js generative background canvas */
        #p5-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
        }

        #p5-canvas canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== MAIN LAYOUT ===== */
        #app {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 16px 24px 0;
            flex-shrink: 0;
        }

        .top-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .top-btn:hover {
            border-color: var(--border-bright);
            color: var(--text);
        }

        .top-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Volume slider */
        #volume-slider {
            position: fixed;
            top: 48px;
            right: 24px;
            z-index: 15;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 8px 14px;
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #volume-slider.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #volume-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 3px;
            background: rgba(200,160,96,0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        #volume-range::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }

        /* ===== STORY SCROLL AREA ===== */
        #story-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 24px 20px;
            scroll-behavior: smooth;
        }

        #story-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        /* Title */
        #game-title {
            text-align: center;
            padding: 40px 0 30px;
        }

        #game-title h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 16px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        #game-title .subtitle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        #game-title .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 20px auto;
            opacity: 0.5;
        }

        /* Story sections */
        .story-section {
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(8px);
            animation: sectionIn 0.6s ease forwards;
        }

        @keyframes sectionIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .story-section p {
            margin-bottom: 12px;
        }

        /* Speaker-tagged paragraphs */
        .story-section .narrator-text {
            color: var(--text);
        }

        .story-section .agent-text {
            color: #b0b0a8;
            font-style: italic;
            padding-left: 16px;
            border-left: 2px solid rgba(184,168,200,0.2);
        }

        .story-section .player-text {
            color: var(--text);
        }

        /* ASCII art */
        .ascii-art {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.15;
            color: var(--text-dim);
            white-space: pre;
            overflow-x: auto;
            margin: 20px 0;
            padding: 16px 0;
            opacity: 0;
            animation: asciiIn 1s ease 0.2s forwards;
            text-align: center;
        }

        .ascii-art.cosmic { color: var(--cosmic); }
        .ascii-art.quantum { color: var(--quantum); }
        .ascii-art.entropiric { color: var(--entropiric); }
        .ascii-art.ember { color: var(--accent); }
        .ascii-art.dim { color: var(--text-faint); }

        @keyframes asciiIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 0.7; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .ascii-art { font-size: 6px; line-height: 1.1; }
        }

        /* Section headers */
        .section-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin: 30px 0 15px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .section-header::before {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            border: 1px solid var(--accent);
            transform: rotate(45deg);
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Stats inline display */
        .stats-block {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--text-faint);
            background: rgba(17,17,17,0.6);
            border-left: 2px solid var(--accent);
            padding: 12px 16px;
            margin: 16px 0;
            line-height: 1.8;
            backdrop-filter: blur(8px);
        }

        /* Scroll indicator */
        #scroll-hint {
            text-align: center;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-faint);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #scroll-hint.visible {
            opacity: 0.5;
        }

        /* Scroll-down arrow */
        #scroll-down-hint {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            font-size: 12px;
            color: var(--text-faint);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, bottom 0.3s ease;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 3px 14px 5px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
        }

        #scroll-down-hint.visible {
            opacity: 0.7;
            animation: hintBounce 2s ease-in-out infinite;
        }

        @keyframes hintBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(4px); }
        }

        /* ===== CHOICES - PINNED BOTTOM ===== */
        #choices-area {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-height: 40vh;
            overflow-y: auto;
            padding: 16px 24px;
            display: none;
        }

        #choices-area.open {
            display: block;
        }

        #choices-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        .choice-card {
            background: rgba(20,20,16,0.4);
            border: 1px solid var(--border);
            padding: 14px 20px;
            margin-bottom: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            opacity: 0;
            transform: translateY(8px);
            animation: cardIn 0.4s ease forwards;
        }

        .choice-card:nth-child(1) { animation-delay: 0.05s; }
        .choice-card:nth-child(2) { animation-delay: 0.1s; }
        .choice-card:nth-child(3) { animation-delay: 0.15s; }
        .choice-card:nth-child(4) { animation-delay: 0.2s; }
        .choice-card:nth-child(5) { animation-delay: 0.25s; }
        .choice-card:nth-child(6) { animation-delay: 0.3s; }
        .choice-card:nth-child(7) { animation-delay: 0.35s; }
        .choice-card:nth-child(8) { animation-delay: 0.4s; }
        .choice-card:nth-child(9) { animation-delay: 0.45s; }
        .choice-card:nth-child(10) { animation-delay: 0.5s; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 3px; height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .choice-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200,160,96,0.04), transparent);
            transition: left 0.5s ease;
        }

        .choice-card:hover {
            border-color: var(--border-bright);
            background: rgba(30,30,24,0.6);
            padding-left: 26px;
        }

        .choice-card:hover::before { transform: scaleY(1); }
        .choice-card:hover::after { left: 100%; }

        .choice-card .choice-text {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 17px;
            line-height: 1.5;
            color: var(--text-dim);
            transition: color 0.3s ease;
        }

        .choice-card:hover .choice-text { color: var(--text); }

        .choice-card .choice-index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            opacity: 0;
            margin-left: 8px;
            transition: opacity 0.3s ease;
        }

        .choice-card:hover .choice-index { opacity: 1; }

        /* ===== STATS PANEL ===== */
        #stats-panel {
            position: fixed;
            top: 50px;
            right: 20px;
            z-index: 20;
            width: 300px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 20px;
            display: none;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        #stats-panel.open { display: block; }

        #stats-panel h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .stat-group { margin-bottom: 14px; }

        .stat-group-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 4px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }

        .stat-row .stat-name { color: var(--text-dim); }
        .stat-row .stat-value { color: var(--text); font-weight: 500; }

        .stat-bar-track {
            width: 70px; height: 3px;
            background: rgba(200,160,96,0.1);
            margin-left: 8px;
            display: inline-block;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.5s ease;
        }

        /* ===== HISTORY PANEL ===== */
        #history-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            background: rgba(10,10,10,0.97);
            display: none;
            overflow-y: auto;
            padding: 60px 40px 100px;
        }

        #history-panel.open { display: block; }

        #history-panel .log-entry {
            max-width: 700px;
            margin: 0 auto 16px;
            padding: 14px 18px;
            border-left: 2px solid var(--border);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-dim);
        }

        #history-panel .log-entry .speaker-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
        }

        #history-panel .log-entry.agent-entry {
            border-left-color: var(--cosmic);
            background: rgba(184,168,200,0.03);
        }

        #history-panel .log-entry.agent-entry .speaker-tag { color: var(--cosmic); }

        #history-close {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 51;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
        }

        /* ===== ENDING OVERLAY ===== */
        #ending-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5,5,5,0.95);
            padding: 40px;
            text-align: center;
        }

        #ending-overlay.open { display: flex; }

        #ending-overlay .ending-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 2s ease forwards;
        }

        #ending-overlay .ending-body {
            max-width: 600px;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-dim);
            opacity: 0;
            animation: fadeUp 2s ease 0.5s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING ===== */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 200;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text-faint);
            transition: opacity 0.8s ease;
        }

        #loading-screen.hidden { opacity: 0; pointer-events: none; }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            body { font-size: 16px; }
            #story-area { padding: 20px 16px 10px; }
            #game-title h1 { font-size: 32px; letter-spacing: 10px; }
            #choices-area { padding: 12px 16px; }
            .choice-card { padding: 12px 16px; }
            #stats-panel { width: calc(100% - 32px); right: 16px; }
            #top-bar { padding: 12px 16px 0; }
            #volume-slider { right: 16px; top: 44px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.2s !important;
            }
            #p5-canvas { display: none; }
            #volume-slider { display: none; }
        }
    </style>
</head>
<body>

<!-- Background layers -->
<div id="scene" class="scene-room"></div>
<div id="vignette"></div>
<div id="p5-canvas"></div>

<!-- Loading -->
<div id="loading-screen">Loading...</div>

<!-- Main app -->
<div id="app">
    <!-- Top bar -->
    <div id="top-bar">
        <button class="top-btn" id="log-btn">LOG</button>
        <button class="top-btn" id="stats-btn">STATS</button>
        <button class="top-btn" id="audio-btn">MUSIC</button>
        <div id="volume-slider">
            <input type="range" id="volume-range" min="0" max="1" step="0.05" value="0.7">
        </div>
    </div>

    <!-- Scrollable story text -->
    <div id="story-area">
        <div id="story-inner">
            <div id="game-title">
                <h1>PLAYVOLUTION</h1>
                <div class="divider"></div>
                <div class="subtitle">surplus &middot; signal &middot; the thing that plays back</div>
            </div>
            <div id="story-content"></div>
        </div>
    </div>

    <!-- Scroll-down hint -->
    <div id="scroll-down-hint">&#x25BC;</div>

    <!-- Pinned bottom choices -->
    <div id="choices-area">
        <div id="choices-inner"></div>
    </div>
</div>

<!-- Overlays -->
<div id="stats-panel"></div>
<div id="history-panel"></div>
<button id="history-close" style="display:none">CLOSE</button>
<div id="ending-overlay">
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-body" id="ending-body"></div>
</div>

<script src="https://unpkg.com/inkjs@2.4.0/dist/ink.js"></script>
<script src="https://unpkg.com/@strudel/web@1.3.0"></script>

<script>
// ===== STRUDEL DYNAMIC MUSIC ENGINE =====
let strudelReady = false;
let audioPlaying = false;
let masterVolume = 0.7;
let currentMusicScene = 'room';
let currentModulation = null;
let lastModulation = { entropy: 0, signal: 0, tempo: 0 };
let currentChapter = 1;

// --- Compute modulation parameters from ink game variables ---
function computeModulation(vars) {
    const entropy = vars.entropiric_saturation || 40;
    const signal = vars.neganthropomorphic_signal || 10;
    const tempo = vars.operational_tempo || 10;
    const fear = vars.public_fear || 30;
    const fidelity = vars.augmentation_fidelity || 50;
    const awareness = vars.cosmic_awareness || 0;
    const chapter = vars.chapter || 1;

    const cutoffBase = 800;
    const cutoffDelta = (fidelity - 50) * 10 - (entropy - 40) * 5;
    const cutoff = Math.max(200, Math.min(4000, cutoffBase + cutoffDelta));

    const gainBase = 0.07;
    const gainDelta = (fear - 30) * 0.0005;
    const gain = Math.max(0.03, Math.min(0.15, gainBase + gainDelta));

    const roomBase = 0.4;
    const roomDelta = (signal - 10) * 0.005 + awareness * 0.01;
    const room = Math.max(0.1, Math.min(0.8, roomBase + roomDelta));

    const speedDiv = Math.max(1, 5 - Math.floor(tempo / 10));

    // Chapter progression: adds layering density and brightness
    const chapterLayer = Math.min(4, Math.floor((chapter - 1) / 2));
    const chapterBrightness = Math.min(1, (chapter - 1) * 0.12);

    return { cutoff, gain, room, speedDiv, entropy, signal, tempo, chapter, chapterLayer, chapterBrightness };
}

// --- Build a pattern string for evaluate() ---
function buildPatternCode(sceneName, mod) {
    if (!mod) mod = { cutoff: 800, gain: 0.07, room: 0.4, speedDiv: 2, chapterLayer: 0, chapterBrightness: 0 };
    const vol = masterVolume;
    const gn = (mod.gain * vol).toFixed(4);
    const cut = Math.round(mod.cutoff * (1 + mod.chapterBrightness * 0.3));
    const rm = mod.room.toFixed(3);
    const spd = mod.speedDiv;
    const layer = mod.chapterLayer;

    const patterns = {
        room: () => {
            let code = `note("<c3 [eb3 g3]>").s("sawtooth")
                .cutoff(${cut}).gain(${gn}).attack(0.3).release(0.8)
                .slow(${spd}).room(${rm}).delay(0.25)`;
            if (layer >= 1) code += `\n  , note("<g2 [bb2 d3]>").s("sawtooth").cutoff(${Math.round(cut * 0.5)}).gain(${(gn * 0.4).toFixed(4)}).attack(0.5).release(1.2).slow(${spd + 1}).room(${rm})`;
            if (layer >= 2) code += `\n  , note("<eb4 g4>").s("sine").gain(${(gn * 0.25).toFixed(4)}).attack(0.6).release(1.0).slow(${spd + 2}).room(${Math.min(0.8, rm + 0.15).toFixed(3)})`;
            if (layer >= 3) code += `\n  , note("<c5 eb5>").s("sine").gain(${(gn * 0.15).toFixed(4)}).attack(0.8).release(1.5).slow(${spd + 3}).room(${Math.min(0.85, rm + 0.2).toFixed(3)}).delay(0.5)`;
            return code;
        },
        chat: () => {
            let code = `note("<a3 [c4 e4]>").s("triangle")
                .cutoff(${Math.min(3000, cut * 1.5)}).gain(${(gn * 0.9).toFixed(4)}).attack(0.1).release(0.5)
                .slow(${spd}).room(${rm}).jux(rev)`;
            if (layer >= 1) code += `\n  , note("<e3 [g3 b3]>").s("triangle").gain(${(gn * 0.3).toFixed(4)}).attack(0.15).release(0.4).slow(${spd}).room(${rm}).delay(0.2)`;
            if (layer >= 2) code += `\n  , note("<a4 c5>").s("sine").gain(${(gn * 0.2).toFixed(4)}).attack(0.3).release(0.6).slow(${spd + 1}).room(${Math.min(0.7, rm + 0.1).toFixed(3)})`;
            return code;
        },
        history: () => {
            let code = `note("<d3 [f3 a3]> <bb3 [g3 d4]>").s("sawtooth")
                .cutoff(${Math.round(cut * 0.8)}).gain(${(gn * 0.85).toFixed(4)}).attack(0.4).release(1.0)
                .slow(${Math.max(2, spd)}).room(${Math.min(0.7, rm + 0.1).toFixed(3)}).delay(0.3)`;
            if (layer >= 1) code += `\n  , note("<d2 [f2 a2]>").s("sawtooth").cutoff(${Math.round(cut * 0.3)}).gain(${(gn * 0.5).toFixed(4)}).attack(0.6).release(1.5).slow(${Math.max(2, spd) + 1}).room(${Math.min(0.8, rm + 0.15).toFixed(3)})`;
            if (layer >= 2) code += `\n  , note("<a4 d5>").s("sine").gain(${(gn * 0.2).toFixed(4)}).attack(0.8).release(1.2).slow(${Math.max(2, spd) + 2}).room(${Math.min(0.85, rm + 0.2).toFixed(3)}).delay(0.5)`;
            return code;
        },
        cosmic: () => {
            let code = `note("<e4 [b3 g4]> <a3 [d4 c5]>").s("sine")
                .gain(${(gn * 0.85).toFixed(4)}).attack(0.5).release(1.2)
                .slow(${Math.max(3, spd + 1)}).room(${Math.min(0.8, rm + 0.15).toFixed(3)}).delay(0.4)
                .jux(x => x.rev().add(0.02))`;
            if (layer >= 1) code += `\n  , note("<e3 [b2 g3]>").s("sine").gain(${(gn * 0.4).toFixed(4)}).attack(0.7).release(1.5).slow(${Math.max(3, spd + 1) + 1}).room(${Math.min(0.85, rm + 0.2).toFixed(3)}).delay(0.6)`;
            if (layer >= 2) code += `\n  , note("<g5 b5>").s("sine").gain(${(gn * 0.15).toFixed(4)}).attack(1.0).release(2.0).slow(${Math.max(3, spd + 1) + 2}).room(${Math.min(0.9, rm + 0.25).toFixed(3)})`;
            if (layer >= 3) code += `\n  , note("<e6>").s("sine").gain(${(gn * 0.08).toFixed(4)}).attack(1.5).release(3.0).slow(8).room(0.9).delay(0.8)`;
            return code;
        },
        quantum: () => {
            let code = `note("<f4 [a4 c5]> <eb4 [bb4 g4]>").s("triangle")
                .cutoff(${Math.min(4000, cut * 1.8)}).gain(${(gn * 0.7).toFixed(4)}).attack(0.2).release(0.6)
                .slow(${spd}).room(${rm}).jux(x => x.fast(1.5))`;
            if (layer >= 1) code += `\n  , note("<f3 [a3 c4]>").s("triangle").gain(${(gn * 0.35).toFixed(4)}).attack(0.15).release(0.4).slow(${spd}).room(${rm})`;
            if (layer >= 2) code += `\n  , note("<f5 a5>").s("sine").gain(${(gn * 0.2).toFixed(4)}).attack(0.3).release(0.8).slow(${spd + 1}).room(${Math.min(0.7, rm + 0.1).toFixed(3)}).delay(0.3)`;
            if (layer >= 3) code += `\n  , note("<c6>").s("sine").gain(${(gn * 0.1).toFixed(4)}).attack(0.5).release(1.2).slow(${spd + 2}).room(${Math.min(0.8, rm + 0.15).toFixed(3)})`;
            return code;
        },
        crisis: () => {
            let code = `note("<c3 [e3 g3]> <ab2 [b2 eb3]>").s("sawtooth")
                .cutoff(${Math.min(800, cut * 0.5)}).gain(${Math.min(0.15, gn * 1.5).toFixed(4)}).attack(0.05).release(0.3)
                .slow(${Math.min(2, spd)}).room(${Math.max(0.1, rm * 0.5).toFixed(3)}).delay(0.1)`;
            if (layer >= 1) code += `\n  , note("<c2 [e2 g2]> <ab1 [b1 eb2]>").s("sawtooth").cutoff(${Math.round(cut * 0.2)}).gain(${(gn * 0.6).toFixed(4)}).attack(0.02).release(0.2).slow(${Math.min(2, spd)}).room(0.15)`;
            if (layer >= 2) code += `\n  , note("<c4 e4>").s("sawtooth").cutoff(${Math.round(cut * 0.7)}).gain(${(gn * 0.3).toFixed(4)}).attack(0.03).release(0.15).slow(1).delay(0.05)`;
            return code;
        },
        ending: () => {
            return `note("<c4 [e4 g4]> <f4 [a4 c5]>").s("sine")
                .gain(${(gn * 0.7).toFixed(4)}).attack(0.6).release(1.5)
                .slow(5).room(${Math.min(0.85, rm + 0.2).toFixed(3)})
              , note("<c3 [e3 g3]>").s("sine").gain(${(gn * 0.3).toFixed(4)}).attack(0.8).release(2.0)
                .slow(6).room(${Math.min(0.9, rm + 0.3).toFixed(3)})`;
        }
    };

    const builder = patterns[sceneName] || patterns.room;
    return builder();
}

// --- Initialize Strudel (called on first user click) ---
async function initAudio() {
    if (strudelReady) return true;
    try {
        if (typeof initStrudel === 'function') {
            await initStrudel();
            strudelReady = true;
            console.log('Strudel audio initialized');
            return true;
        }
        console.warn('Strudel not loaded');
        return false;
    } catch(e) {
        console.warn('Strudel init failed:', e.message);
        return false;
    }
}

// --- Start or switch to a scene's pattern ---
async function playSceneMusic(sceneName, mod) {
    if (!strudelReady) {
        const ok = await initAudio();
        if (!ok) return;
    }

    currentMusicScene = sceneName;
    currentModulation = mod || null;

    // Stop current pattern
    try { hush(); } catch(e) {}

    const code = buildPatternCode(sceneName, mod);
    try {
        if (typeof evaluate === 'function') {
            evaluate(code);
        } else {
            // Fallback: take only the first line (the primary pattern) and play it
            const firstLine = code.split('\n')[0];
            eval(firstLine + '.play()');
        }
        audioPlaying = true;
    } catch(e) {
        console.warn('Strudel play failed:', e.message);
        // Secondary fallback: try direct pattern construction
        try {
            const fallbackCode = buildPatternCode(sceneName, mod).split('\n')[0];
            eval(fallbackCode + '.play()');
            audioPlaying = true;
        } catch(e2) {
            console.warn('Strudel fallback failed:', e2.message);
        }
    }
}

// --- Stop all music ---
function stopMusic() {
    try { hush(); } catch(e) {}
    audioPlaying = false;
}

// --- Sound effects using short Strudel patterns ---
async function playSfx(type) {
    if (!strudelReady) return;
    const sfxPatterns = {
        choice: 'note("c5").s("sine").gain(0.06).attack(0.01).release(0.15)',
        transition: 'note("<e4 g4>").s("triangle").gain(0.04).attack(0.02).release(0.3).room(0.3)',
        discovery: 'note("<a4 c5 e5>").s("sine").gain(0.05).attack(0.05).release(0.4).room(0.4)',
        companion: 'note("<d4 f4 a4> <c4 e4 g4>").s("triangle").gain(0.04).attack(0.05).release(0.35).room(0.3)',
        crisis_alert: 'note("<c3 eb3>").s("sawtooth").cutoff(400).gain(0.08).attack(0.01).release(0.2)',
        ending_resolve: 'note("<c4 e4 g4 c5>").s("sine").gain(0.05).attack(0.1).release(0.8).room(0.5).slow(2)'
    };
    const code = sfxPatterns[type];
    if (!code) return;
    try {
        // Play SFX on top of existing music by using a separate short pattern
        const sfxPattern = eval(code);
        if (sfxPattern && typeof sfxPattern.play === 'function') {
            sfxPattern.play();
            // Auto-stop after a short time to prevent overlap
            setTimeout(() => {
                try { if (sfxPattern.stop) sfxPattern.stop(); } catch(e) {}
            }, 2000);
        }
    } catch(e) {
        // SFX failure is non-critical
    }
}

// --- Called from updateStats / renderStory to re-evaluate with new modulation ---
function applyGameModulation(vars) {
    if (!audioPlaying || !strudelReady) return;

    const mod = computeModulation(vars);
    const scene = window._currentScene || 'room';

    // Track chapter changes
    if (vars.chapter && vars.chapter !== currentChapter) {
        currentChapter = vars.chapter;
    }

    // Only re-trigger if key variables changed significantly
    const entropyShift = Math.abs(mod.entropy - lastModulation.entropy);
    const signalShift = Math.abs(mod.signal - lastModulation.signal);
    const tempoShift = Math.abs(mod.tempo - lastModulation.tempo);

    if (entropyShift > 10 || signalShift > 8 || tempoShift > 5) {
        lastModulation = { entropy: mod.entropy, signal: mod.signal, tempo: mod.tempo };
        playSceneMusic(scene, mod);
    }
}

// --- Set master volume ---
function setMasterVolume(v) {
    masterVolume = Math.max(0, Math.min(1, v));
    // Re-evaluate current pattern with new volume
    if (audioPlaying && strudelReady) {
        const scene = window._currentScene || 'room';
        playSceneMusic(scene, currentModulation);
    }
}

// --- Audio toggle + volume slider ---
document.addEventListener('DOMContentLoaded', () => {
    const audioBtn = document.getElementById('audio-btn');
    if (!audioBtn) return;

    audioBtn.addEventListener('click', async () => {
        if (!audioPlaying) {
            const ok = await initAudio();
            if (ok) {
                const scene = window._currentScene || 'room';
                playSceneMusic(scene);
                audioBtn.textContent = 'MUSIC \u25CF';
                audioBtn.classList.add('active');
                document.getElementById('volume-slider')?.classList.add('visible');
            }
        } else {
            stopMusic();
            audioBtn.textContent = 'MUSIC';
            audioBtn.classList.remove('active');
            document.getElementById('volume-slider')?.classList.remove('visible');
        }
    });

    // Volume slider
    const volSlider = document.getElementById('volume-range');
    if (volSlider) {
        volSlider.addEventListener('input', (e) => {
            setMasterVolume(parseFloat(e.target.value));
        });
    }
});

// Expose for the game engine
window.playSceneMusic = playSceneMusic;
window.stopMusic = stopMusic;
window.applyGameModulation = applyGameModulation;
window.playSfx = playSfx;
window.setMasterVolume = setMasterVolume;
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

<script>
// ===== P5.JS GENERATIVE BACKGROUND =====
let p5Scene = 'room';
let p5Transition = 0;
let p5TargetScene = 'room';

const p5Sketch = (p) => {
    let particles = [];
    const maxParticles = 60;

    p.setup = function() {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-canvas');
        p.noiseSeed(42);
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.frameRate(30);

        for (let i = 0; i < maxParticles; i++) {
            particles.push({
                x: p.random(p.width),
                y: p.random(p.height),
                vx: 0, vy: 0,
                size: p.random(1, 2.5),
                life: p.random(0.3, 1)
            });
        }
    };

    p.draw = function() {
        p.background(0, 0, 0, 8); // slow fade
        const t = p.frameCount * 0.005;

        // Scene parameters
        const sceneParams = getSceneParams(p5Scene);
        p5Transition = p.lerp(p5Transition, 1, 0.02);

        switch (sceneParams.style) {
            case 'flow':
                drawFlowField(p, t, sceneParams);
                break;
            case 'network':
                drawNetwork(p, t, sceneParams);
                break;
            case 'rings':
                drawRings(p, t, sceneParams);
                break;
            case 'glitch':
                drawGlitch(p, t, sceneParams);
                break;
            case 'constellation':
                drawConstellation(p, t, sceneParams);
                break;
            default:
                drawFlowField(p, t, sceneParams);
        }
    };

    p.windowResized = function() {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
    };

    // ===== SCENE DRAWING FUNCTIONS =====

    function drawFlowField(p, t, params) {
        const scale = 0.003;
        const h = params.hue;
        p.noStroke();
        for (let i = 0; i < particles.length; i++) {
            const pt = particles[i];
            const angle = p.noise(pt.x * scale, pt.y * scale, t * params.speed) * p.TWO_PI * 2;
            pt.vx = p.lerp(pt.vx, p.cos(angle) * params.force, 0.1);
            pt.vy = p.lerp(pt.vy, p.sin(angle) * params.force, 0.1);
            pt.x += pt.vx;
            pt.y += pt.vy;
            if (pt.x < 0) pt.x = p.width;
            if (pt.x > p.width) pt.x = 0;
            if (pt.y < 0) pt.y = p.height;
            if (pt.y > p.height) pt.y = 0;
            p.fill(h, params.sat, params.bri, pt.life * params.alpha * 60);
            p.circle(pt.x, pt.y, pt.size * params.sizeMul);
        }
    }

    function drawNetwork(p, t, params) {
        const count = 25;
        const pts = [];
        for (let i = 0; i < count; i++) {
            const x = p.width * 0.5 + p.cos(t * params.speed + i * 0.8) * p.width * 0.3 * p.sin(i * 0.3);
            const y = p.height * 0.5 + p.sin(t * params.speed * 0.7 + i * 1.1) * p.height * 0.3 * p.cos(i * 0.4);
            pts.push({ x, y });
            p.noStroke();
            p.fill(params.hue, params.sat, params.bri, params.alpha * 40);
            p.circle(x, y, 3);
        }
        // connections
        p.stroke(params.hue, params.sat, params.bri, params.alpha * 12);
        p.strokeWeight(0.5);
        for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
                const d = p.dist(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
                if (d < 150) {
                    p.line(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
                }
            }
        }
    }

    function drawRings(p, t, params) {
        p.noFill();
        const cx = p.width / 2;
        const cy = p.height / 2;
        for (let i = 0; i < 8; i++) {
            const r = 50 + i * 40 + p.sin(t * params.speed + i * 0.5) * 20;
            const wobble = p.noise(i * 0.5, t * params.speed) * 30;
            p.stroke(params.hue + i * 5, params.sat, params.bri, params.alpha * 15);
            p.strokeWeight(1);
            p.beginShape();
            for (let a = 0; a < p.TWO_PI; a += 0.1) {
                const rr = r + p.sin(a * 3 + t * 2) * wobble;
                p.vertex(cx + p.cos(a) * rr, cy + p.sin(a) * rr);
            }
            p.endShape(p.CLOSE);
        }
    }

    function drawGlitch(p, t, params) {
        // Horizontal glitch bars
        for (let i = 0; i < 8; i++) {
            const y = p.random(p.height);
            const h = p.random(1, 6);
            const offset = p.random(-30, 30) * (p.noise(t * 5, i) - 0.5) * 2;
            p.noStroke();
            p.fill(params.hue + p.random(-20, 20), params.sat, params.bri, params.alpha * 20);
            p.rect(offset, y, p.width, h);
        }
        // Scattered particles
        p.noStroke();
        for (let i = 0; i < 15; i++) {
            const x = p.random(p.width);
            const y = p.random(p.height);
            const s = p.random(2, 6);
            p.fill(params.hue, params.sat, params.bri, p.random(5, 25));
            p.rect(x, y, s, s * p.random(0.2, 3));
        }
    }

    function drawConstellation(p, t, params) {
        const count = 30;
        p.noStroke();
        for (let i = 0; i < count; i++) {
            const seed = i * 100;
            const x = (p.noise(seed, t * params.speed * 0.3) * 1.4 - 0.2) * p.width;
            const y = (p.noise(seed + 50, t * params.speed * 0.3) * 1.4 - 0.2) * p.height;
            const s = 1 + p.sin(t * 2 + i) * 0.8;
            const a = (0.1 + p.sin(t + i * 0.5) * 0.08) * params.alpha * 50;
            p.fill(params.hue + p.sin(i * 0.3) * 15, params.sat * 0.5, params.bri, a);
            p.circle(x, y, s + 1);
            // occasional bright star
            if (i % 7 === 0) {
                p.fill(params.hue, params.sat * 0.3, 100, a * 1.5);
                p.circle(x, y, s * 0.5);
            }
        }
    }

    function getSceneParams(scene) {
        const presets = {
            room:       { style: 'flow',         hue: 35,  sat: 40, bri: 50, speed: 0.5, force: 0.8, alpha: 0.5, sizeMul: 1.0 },
            chat:       { style: 'network',       hue: 210, sat: 30, bri: 55, speed: 0.6, force: 0.5, alpha: 0.6, sizeMul: 0.8 },
            history:    { style: 'rings',          hue: 25,  sat: 50, bri: 45, speed: 0.3, force: 0.6, alpha: 0.5, sizeMul: 1.2 },
            cosmic:     { style: 'constellation',  hue: 270, sat: 40, bri: 60, speed: 0.4, force: 0.3, alpha: 0.7, sizeMul: 0.6 },
            quantum:    { style: 'flow',           hue: 200, sat: 35, bri: 55, speed: 0.8, force: 1.2, alpha: 0.5, sizeMul: 0.7 },
            crisis:     { style: 'glitch',         hue: 0,   sat: 60, bri: 50, speed: 1.0, force: 2.0, alpha: 0.8, sizeMul: 1.5 },
            ending:     { style: 'constellation',  hue: 140, sat: 30, bri: 50, speed: 0.2, force: 0.2, alpha: 0.4, sizeMul: 0.5 }
        };
        return presets[scene] || presets.room;
    }
};

// Initialize p5
new p5(p5Sketch);

// Scene setter called by the game engine
window.setP5Scene = function(sceneName) {
    if (sceneName === p5Scene) return;
    p5Scene = sceneName;
};

window.setP5Scene('room');
</script>

    function renderAsciiArt(name) {
        const piece = asciiArt[name];
        if (!piece) return null;
        const el = document.createElement('pre');
        el.className = 'ascii-art ' + (piece.theme || '');
        el.textContent = piece.art;
        return el;
    }

    // Detect which ASCII art to show from story text
    function detectAsciiArt(text) {
        const t = text.toLowerCase();
        // Check for explicit tags first: [art: name]
        const tagMatch = text.match(/\[art:\s*(\w+)\]/i);
        if (tagMatch && asciiArt[tagMatch[1]]) return tagMatch[1];

        // Auto-detect from content
        if (t.includes('laptop') || t.includes('screen flickers') || t.includes('apartment')) return 'desk';
        if (t.includes('river city') || t.includes('market') || t.includes('streets')) return 'city';
        if (t.includes('temple') || t.includes('chant-master') || t.includes('granar')) return 'temple';
        if (t.includes('meshwork') || t.includes('network') || t.includes('surplus flow')) return 'network';
        if (t.includes('neganthropomorph') || t.includes('perpendicular') || t.includes('signal from')) return 'signal';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) return 'crisis';
        if (t.includes('cosmic') && (t.includes('awareness') || t.includes('dream'))) return 'signal';
        if (t.includes('agent') && t.includes('outputs')) return 'agent';
        if (t.includes('agent') && (t.includes('dream') || t.includes('strange') || t.includes('anomal'))) return 'agent_anomaly';
        return null;
    }

    // Track last shown art to avoid repetition
    let lastArt = '';

    // ===== SCENE DETECTION =====
    // Priority 1: ink tags (# scene:name)
    // Priority 2: text keyword fallback
    function setSceneFromTags(tags) {
        for (const tag of tags) {
            const sceneMatch = tag.match(/^scene:(\w+)$/);
            if (sceneMatch) {
                const name = sceneMatch[1];
                if (name !== currentScene) {
                    currentScene = name;
                    sceneEl.className = 'scene-' + name;
                    if (window.setP5Scene) window.setP5Scene(name);
                    window._currentScene = name;
                    if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
                        window.playSceneMusic(name);
                    }
                }
                return true;
            }
        }
        return false;
    }

    function processSfxTags(tags) {
        for (const tag of tags) {
            const sfxMatch = tag.match(/^sfx:(\w+)$/);
            if (sfxMatch && window.playSfx) {
                window.playSfx(sfxMatch[1]);
            }
        }
    }

    function setScene(text) {
        const t = text.toLowerCase();
        let name = 'room';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) name = 'crisis';
        else if (t.includes('cosmic') || t.includes('neganthropomorph') || t.includes('perpendicular')) name = 'cosmic';
        else if (t.includes('quantum') || t.includes('telepathy') || t.includes('psionic') || t.includes('magick')) name = 'quantum';
        else if (t.includes('river city') || t.includes('granar') || t.includes('temple') || t.includes('chant-master') ||
                 t.includes('feudal') || t.includes('colonial') || t.includes('teotihuacan')) name = 'history';
        else if (t.includes('chat') || t.includes('agent') || t.includes('output') || t.includes('prompt')) name = 'chat';

        if (name === currentScene) return;
        currentScene = name;
        sceneEl.className = 'scene-' + name;

        // Update p5.js generative visuals to match
        if (window.setP5Scene) window.setP5Scene(name);

        // Update dynamic music to match scene
        window._currentScene = name;
        if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
            window.playSceneMusic(name);
        }
    }

    // ===== RENDER STORY =====
    function renderStory() {
        let paragraphs = [];
        let allTags = [];
        while (story.canContinue) {
            let text = story.Continue();
            if (text && text.trim()) paragraphs.push(text.trim());
            // Collect ink tags
            if (story.currentTags && story.currentTags.length > 0) {
                allTags.push(...story.currentTags);
            }
        }

        if (paragraphs.length === 0) {
            if (story.currentChoices.length > 0) showChoices();
            else if (!story.canContinue) showEnding();
            return;
        }

        // Process SFX tags first (e.g., # sfx:companion, # sfx:ending_resolve)
        const fullText = paragraphs.join(' ');
        if (allTags.length > 0) {
            processSfxTags(allTags);
            // Scene detection: try ink tags first, fall back to text keywords
            if (!setSceneFromTags(allTags)) {
                setScene(fullText);
            }
        } else {
            // Fallback to text keyword detection
            setScene(fullText);
        }

        // ASCII art detection
        const artName = detectAsciiArt(fullText);
        if (artName && artName !== lastArt) {
            lastArt = artName;
            const artEl = renderAsciiArt(artName);
            if (artEl) storyContent.appendChild(artEl);
        }

        // Build section
        const section = document.createElement('div');
        section.className = 'story-section';

        paragraphs.forEach(p => {
            // Section headers (-- TITLE --)
            const headerMatch = p.match(/^--\s*(.+?)\s*--$/);
            if (headerMatch) {
                const hdr = document.createElement('div');
                hdr.className = 'section-header';
                hdr.textContent = headerMatch[1];
                section.appendChild(hdr);
                return;
            }

            // Agent dialogue (quoted)
            if (p.startsWith('"') && p.endsWith('"') && p.length > 30) {
                const el = document.createElement('p');
                el.className = 'agent-text';
                el.textContent = p.slice(1, -1);
                section.appendChild(el);
                addToLog('the agent', p.slice(1, -1));
                return;
            }

            // Player/narrator text
            const el = document.createElement('p');
            el.className = 'narrator-text';
            el.textContent = p;
            section.appendChild(el);
            addToLog('', p);
        });

        storyContent.appendChild(section);

        // Feed game variables to music modulation after each story beat
        if (window.applyGameModulation) {
            try { window.applyGameModulation(story.variablesState); } catch(e) {}
        }

        // Scroll to the start of the new section
        requestAnimationFrame(() => {
            scrollToElement(section);
        });

        // Show choices if available
        if (story.currentChoices.length > 0) {
            showChoices();
        } else if (!story.canContinue) {
            showEnding();
        }
    }

    // ===== CHOICES =====
    function showChoices() {
        choicesInner.innerHTML = '';
        choicesArea.classList.add('open');
        updateScrollHint();

        story.currentChoices.forEach((choice, i) => {
            const card = document.createElement('div');
            card.className = 'choice-card';
            card.innerHTML = `<span class="choice-text">${choice.text}</span><span class="choice-index">&rarr;</span>`;
            card.addEventListener('click', () => {
                choicesArea.classList.remove('open');
                // Play choice SFX
                if (window.playSfx) window.playSfx('choice');
                story.ChooseChoiceIndex(i);
                addToLog('You', choice.text);

                // Show player's choice in story
                const choiceSection = document.createElement('div');
                choiceSection.className = 'story-section';
                const el = document.createElement('p');
                el.className = 'player-text';
                el.style.color = 'var(--accent)';
                el.textContent = '> ' + choice.text;
                choiceSection.appendChild(el);
                storyContent.appendChild(choiceSection);

                setTimeout(() => {
                    renderStory();
                }, 150);
            });
            choicesInner.appendChild(card);
        });

        // Scroll so new text before choices is visible
        requestAnimationFrame(() => {
            const lastSection = storyContent.lastElementChild;
            if (lastSection) scrollToElement(lastSection);
        });
    }

    // ===== ENDING =====
    function showEnding() {
        endingReached = true;

        // Switch to ending scene music
        window._currentScene = 'ending';
        if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
            window.playSceneMusic('ending');
        }
        if (window.setP5Scene) window.setP5Scene('ending');
        if (window.playSfx) window.playSfx('ending_resolve');

        // Find ending title from recent log
        const recent = historyLog.slice(-20);
        let title = 'THE END';
        let body = [];

        for (let i = recent.length - 1; i >= 0; i--) {
            const t = recent[i].text.trim();
            if (t === t.toUpperCase() && t.length > 3 && t.length < 60 && !t.includes(':')) {
                title = t;
                break;
            }
            body.unshift(t);
        }
        if (body.length === 0) body = ['The story has ended.'];

        $('ending-title').textContent = title;
        $('ending-body').textContent = body.join(' ').slice(0, 2000);
        $('ending-overlay').classList.add('open');
        sceneEl.className = 'scene-ending';
    }

    // ===== LOG =====
    function addToLog(speaker, text) {
        historyLog.push({ speaker, text });
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (speaker === 'the agent' ? ' agent-entry' : '');
        if (speaker) {
            const tag = document.createElement('div');
            tag.className = 'speaker-tag';
            tag.textContent = speaker;
            entry.appendChild(tag);
        }
        const content = document.createElement('div');
        content.textContent = text;
        entry.appendChild(content);
        historyPanel.appendChild(entry);
    }

    // ===== STATS =====
    function updateStats() {
        if (!story) return;
        const vars = story.variablesState;
        const sections = [
            { label: 'Capabilities', stats: ['reading', 'weaving', 'play', 'craft', 'nerve', 'swarm'] },
            { label: 'Resources', stats: ['time_remaining', 'attention', 'credibility', 'stealth'] },
            { label: 'Cosmic', stats: ['entropiric_saturation', 'neganthropomorphic_signal', 'cosmic_awareness'] },
            { label: 'Quantum', stats: ['quantum_telepathy', 'psionic_perception', 'magickal_discipline'] },
            { label: 'Meshwork', stats: ['meshwork_resilience', 'operational_tempo', 'public_initiative'] },
            { label: 'Agent', stats: ['agent_classical_strength', 'agent_generative_strength', 'agent_autonomy', 'augmentation_fidelity'] },
            { label: 'Factions', stats: ['faction_ledger', 'faction_blade', 'faction_veil', 'faction_commons', 'faction_mesh', 'faction_playhouse'] }
        ];

        let html = '<h3>Character Sheet</h3>';
        sections.forEach(sec => {
            html += `<div class="stat-group"><div class="stat-group-label">${sec.label}</div>`;
            sec.stats.forEach(stat => {
                try {
                    const val = vars[stat];
                    if (val !== undefined && val !== null) {
                        const n = typeof val === 'number' ? val : 0;
                        const max = stat.includes('faction') ? 100 : 20;
                        const pct = Math.min(100, Math.max(0, (n / max) * 100));
                        html += `<div class="stat-row"><span class="stat-name">${stat.replace(/_/g, ' ')}</span><span><span class="stat-value">${n}</span><span class="stat-bar-track"><span class="stat-bar-fill" style="width:${pct}%"></span></span></span></div>`;
                    }
                } catch(e) {}
            });
            html += '</div>';
        });
        statsPanel.innerHTML = html;

        // Feed game variables to music modulation engine
        if (window.applyGameModulation) window.applyGameModulation(vars);
    }

    // ===== EVENT HANDLERS =====
    let statsOpen = false;
    $('stats-btn').addEventListener('click', () => {
        statsOpen = !statsOpen;
        if (statsOpen) { updateStats(); statsPanel.classList.add('open'); }
        else statsPanel.classList.remove('open');
    });

    let logOpen = false;
    $('log-btn').addEventListener('click', () => {
        logOpen = !logOpen;
        if (logOpen) {
            historyPanel.classList.add('open');
            $('history-close').style.display = 'block';
            historyPanel.scrollTop = historyPanel.scrollHeight;
        } else {
            historyPanel.classList.remove('open');
            $('history-close').style.display = 'none';
        }
    });

    $('history-close').addEventListener('click', () => {
        logOpen = false;
        historyPanel.classList.remove('open');
        $('history-close').style.display = 'none';
    });

    // ===== LOAD =====
    async function loadStory() {
        try {
            const resp = await fetch('inkle/story.json');
            if (!resp.ok) throw new Error('Could not load story.json: ' + resp.status);
            const json = await resp.json();
            if (typeof inkjs === 'undefined') throw new Error('inkjs not loaded');
            story = new inkjs.Story(json);
            $('loading-screen').classList.add('hidden');
            setTimeout(() => $('loading-screen').style.display = 'none', 1000);
            renderStory();
        } catch (err) {
            $('loading-screen').textContent = 'Error: ' + err.message;
            console.error(err);
        }
    }

    loadStory();
</script>
