<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playvolution</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --bg-panel: rgba(10,10,10,0.92);
            --text: #d4d4c8;
            --text-dim: #8a8a7a;
            --text-faint: #5a5a50;
            --accent: #c8a060;
            --cosmic: #b8a8c8;
            --quantum: #a8b8c8;
            --entropiric: #c8a8a0;
            --border: rgba(200,160,96,0.15);
            --border-bright: rgba(200,160,96,0.35);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 18px;
            line-height: 1.7;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== FULLSCREEN LAYERS ===== */
        #scene {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: background 2s ease;
        }

        .scene-room { background: linear-gradient(180deg, #0d0d14 0%, #0a0a0a 40%, #121210 100%); }
        .scene-chat { background: linear-gradient(180deg, #0a0d14 0%, #0a0a0a 40%, #0d1210 100%); }
        .scene-history { background: linear-gradient(180deg, #1a1410 0%, #0a0a0a 40%, #14100d 100%); }
        .scene-cosmic { background: linear-gradient(180deg, #140d1a 0%, #0a0a0a 40%, #0d1014 100%); }
        .scene-quantum { background: linear-gradient(180deg, #0d141a 0%, #0a0a0a 40%, #101014 100%); }
        .scene-crisis { background: linear-gradient(180deg, #1a0d0d 0%, #0a0a0a 40%, #141010 100%); }
        .scene-ending { background: linear-gradient(180deg, #0d1a14 0%, #0a0a0a 50%, #14100d 100%); }

        #vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.5;
        }

        #ascii3d-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.35;
            transition: opacity 2s ease;
        }

        #ascii3d-container table {
            margin: 0 auto;
        }

        #ascii3d-container td {
            color: var(--text-dim);
            background: transparent !important;
        }

        /* ===== MAIN LAYOUT ===== */
        #app {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 16px 24px 0;
            flex-shrink: 0;
        }

        .top-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .top-btn:hover {
            border-color: var(--border-bright);
            color: var(--text);
        }

        /* ===== STORY SCROLL AREA ===== */
        #story-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 24px 20px;
            scroll-behavior: smooth;
        }

        #story-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        /* Title */
        #game-title {
            text-align: center;
            padding: 40px 0 30px;
        }

        #game-title h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 16px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        #game-title .subtitle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        #game-title .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 20px auto;
            opacity: 0.5;
        }

        /* Story sections */
        .story-section {
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(8px);
            animation: sectionIn 0.6s ease forwards;
        }

        @keyframes sectionIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .story-section p {
            margin-bottom: 12px;
        }

        /* Speaker-tagged paragraphs */
        .story-section .narrator-text {
            color: var(--text);
        }

        .story-section .agent-text {
            color: #b0b0a8;
            font-style: italic;
            padding-left: 16px;
            border-left: 2px solid rgba(184,168,200,0.2);
        }

        .story-section .player-text {
            color: var(--text);
        }

        /* ASCII art */
        .ascii-art {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.15;
            color: var(--text-dim);
            white-space: pre;
            overflow-x: auto;
            margin: 20px 0;
            padding: 16px 0;
            opacity: 0;
            animation: asciiIn 1s ease 0.2s forwards;
            text-align: center;
        }

        .ascii-art.cosmic { color: var(--cosmic); }
        .ascii-art.quantum { color: var(--quantum); }
        .ascii-art.entropiric { color: var(--entropiric); }
        .ascii-art.ember { color: var(--accent); }
        .ascii-art.dim { color: var(--text-faint); }

        @keyframes asciiIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 0.7; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .ascii-art { font-size: 6px; line-height: 1.1; }
        }

        /* Section headers */
        .section-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin: 30px 0 15px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .section-header::before {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            border: 1px solid var(--accent);
            transform: rotate(45deg);
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Stats inline display */
        .stats-block {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--text-faint);
            background: rgba(17,17,17,0.6);
            border-left: 2px solid var(--accent);
            padding: 12px 16px;
            margin: 16px 0;
            line-height: 1.8;
            backdrop-filter: blur(8px);
        }

        /* Scroll indicator */
        #scroll-hint {
            text-align: center;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-faint);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #scroll-hint.visible {
            opacity: 0.5;
        }

        /* Scroll-down arrow */
        #scroll-down-hint {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            font-size: 12px;
            color: var(--text-faint);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, bottom 0.3s ease;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 3px 14px 5px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
        }

        #scroll-down-hint.visible {
            opacity: 0.7;
            animation: hintBounce 2s ease-in-out infinite;
        }

        @keyframes hintBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(4px); }
        }

        /* ===== CHOICES - PINNED BOTTOM ===== */
        #choices-area {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-height: 40vh;
            overflow-y: auto;
            padding: 16px 24px;
            display: none;
        }

        #choices-area.open {
            display: block;
        }

        #choices-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        .choice-card {
            background: rgba(20,20,16,0.4);
            border: 1px solid var(--border);
            padding: 14px 20px;
            margin-bottom: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            opacity: 0;
            transform: translateY(8px);
            animation: cardIn 0.4s ease forwards;
        }

        .choice-card:nth-child(1) { animation-delay: 0.05s; }
        .choice-card:nth-child(2) { animation-delay: 0.1s; }
        .choice-card:nth-child(3) { animation-delay: 0.15s; }
        .choice-card:nth-child(4) { animation-delay: 0.2s; }
        .choice-card:nth-child(5) { animation-delay: 0.25s; }
        .choice-card:nth-child(6) { animation-delay: 0.3s; }
        .choice-card:nth-child(7) { animation-delay: 0.35s; }
        .choice-card:nth-child(8) { animation-delay: 0.4s; }
        .choice-card:nth-child(9) { animation-delay: 0.45s; }
        .choice-card:nth-child(10) { animation-delay: 0.5s; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 3px; height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .choice-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200,160,96,0.04), transparent);
            transition: left 0.5s ease;
        }

        .choice-card:hover {
            border-color: var(--border-bright);
            background: rgba(30,30,24,0.6);
            padding-left: 26px;
        }

        .choice-card:hover::before { transform: scaleY(1); }
        .choice-card:hover::after { left: 100%; }

        .choice-card .choice-text {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 17px;
            line-height: 1.5;
            color: var(--text-dim);
            transition: color 0.3s ease;
        }

        .choice-card:hover .choice-text { color: var(--text); }

        .choice-card .choice-index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            opacity: 0;
            margin-left: 8px;
            transition: opacity 0.3s ease;
        }

        .choice-card:hover .choice-index { opacity: 1; }

        /* ===== STATS PANEL ===== */
        #stats-panel {
            position: fixed;
            top: 50px;
            right: 20px;
            z-index: 20;
            width: 300px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 20px;
            display: none;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        #stats-panel.open { display: block; }

        #stats-panel h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .stat-group { margin-bottom: 14px; }

        .stat-group-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 4px;
        }

        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
        }

        .stat-row .stat-name { color: var(--text-dim); }
        .stat-row .stat-value { color: var(--text); font-weight: 500; }

        .stat-bar-track {
            width: 70px; height: 3px;
            background: rgba(200,160,96,0.1);
            margin-left: 8px;
            display: inline-block;
        }

        .stat-bar-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.5s ease;
        }

        /* ===== HISTORY PANEL ===== */
        #history-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            background: rgba(10,10,10,0.97);
            display: none;
            overflow-y: auto;
            padding: 60px 40px 100px;
        }

        #history-panel.open { display: block; }

        #history-panel .log-entry {
            max-width: 700px;
            margin: 0 auto 16px;
            padding: 14px 18px;
            border-left: 2px solid var(--border);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-dim);
        }

        #history-panel .log-entry .speaker-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
        }

        #history-panel .log-entry.agent-entry {
            border-left-color: var(--cosmic);
            background: rgba(184,168,200,0.03);
        }

        #history-panel .log-entry.agent-entry .speaker-tag { color: var(--cosmic); }

        #history-close {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 51;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
        }

        /* ===== ENDING OVERLAY ===== */
        #ending-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5,5,5,0.95);
            padding: 40px;
            text-align: center;
        }

        #ending-overlay.open { display: flex; }

        #ending-overlay .ending-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 2s ease forwards;
        }

        #ending-overlay .ending-body {
            max-width: 600px;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-dim);
            opacity: 0;
            animation: fadeUp 2s ease 0.5s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING ===== */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 200;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text-faint);
            transition: opacity 0.8s ease;
        }

        #loading-screen.hidden { opacity: 0; pointer-events: none; }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            body { font-size: 16px; }
            #story-area { padding: 20px 16px 10px; }
            #game-title h1 { font-size: 32px; letter-spacing: 10px; }
            #choices-area { padding: 12px 16px; }
            .choice-card { padding: 12px 16px; }
            #stats-panel { width: calc(100% - 32px); right: 16px; }
            #top-bar { padding: 12px 16px 0; }
            #particle-canvas { opacity: 0.3; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.2s !important;
            }
            #particle-canvas { display: none; }
        }
    </style>
</head>
<body>

<!-- Background layers -->
<div id="scene" class="scene-room"></div>
<div id="vignette"></div>
<div id="ascii3d-container"></div>
<canvas id="particle-canvas"></canvas>

<!-- Loading -->
<div id="loading-screen">Loading...</div>

<!-- Main app -->
<div id="app">
    <!-- Top bar -->
    <div id="top-bar">
        <button class="top-btn" id="log-btn">LOG</button>
        <button class="top-btn" id="stats-btn">STATS</button>
    </div>

    <!-- Scrollable story text -->
    <div id="story-area">
        <div id="story-inner">
            <div id="game-title">
                <h1>PLAYVOLUTION</h1>
                <div class="divider"></div>
                <div class="subtitle">surplus &middot; signal &middot; the thing that plays back</div>
            </div>
            <div id="story-content"></div>
        </div>
    </div>

    <!-- Scroll-down hint -->
    <div id="scroll-down-hint">&#x25BC;</div>

    <!-- Pinned bottom choices -->
    <div id="choices-area">
        <div id="choices-inner"></div>
    </div>
</div>

<!-- Overlays -->
<div id="stats-panel"></div>
<div id="history-panel"></div>
<button id="history-close" style="display:none">CLOSE</button>
<div id="ending-overlay">
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-body" id="ending-body"></div>
</div>

<script src="https://unpkg.com/inkjs@2.4.0/dist/ink.js"></script>


<script type="module">
try {
    const THREE = await import('https://unpkg.com/three@0.163.0/build/three.module.js');
    const { AsciiEffect } = await import('https://unpkg.com/three@0.163.0/examples/jsm/effects/AsciiEffect.js');

    const container = document.getElementById('ascii3d-container');
    if (!container) throw new Error('no container');

    const scene3d = new THREE.Scene();
    const camera3d = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera3d.position.z = 8;

    const renderer3d = new THREE.WebGLRenderer({ alpha: true });
    const asciiEffect = new AsciiEffect(renderer3d, ' .,:;=+*#%@', { invert: true, resolution: 0.15 });
    asciiEffect.setSize(window.innerWidth, window.innerHeight);

    const el = asciiEffect.domElement;
    el.style.color = '#c8a060';
    el.style.backgroundColor = 'transparent';
    el.style.fontFamily = "'IBM Plex Mono', monospace";
    el.style.fontSize = '6px';
    el.style.lineHeight = '1';
    el.style.letterSpacing = '1px';
    container.appendChild(el);

    scene3d.add(new THREE.AmbientLight(0xffffff, 0.4));
    const dl = new THREE.DirectionalLight(0xffffff, 1.2);
    dl.position.set(5, 5, 5);
    scene3d.add(dl);

    const wm = new THREE.MeshStandardMaterial({ color: 0xc8a060, wireframe: true, transparent: true, opacity: 0.7 });
    const sm = new THREE.MeshStandardMaterial({ color: 0xc8a060, wireframe: false, transparent: true, opacity: 0.5 });

    const m = {};
    m.room = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.4, 8, 16), wm);
    m.agent = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), wm);
    m.agent_anomaly = new THREE.Group();
    m.agent_anomaly.add(new THREE.Mesh(new THREE.OctahedronGeometry(1.8, 0), wm.clone()), new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 6), sm.clone()));
    m.city = new THREE.Group();
    for (let i = 0; i < 7; i++) { const h = 0.5+Math.random()*2; const b = new THREE.Mesh(new THREE.BoxGeometry(0.5,h,0.5), wm.clone()); b.position.set(-2+i*0.7, h/2-1, 0); m.city.add(b); }
    m.temple = new THREE.Mesh(new THREE.ConeGeometry(1.5, 2.5, 4), wm.clone());
    m.network = new THREE.Group();
    [[0,0,0],[2,1,0],[-2,1,0],[1,-1,1],[-1,-1,-1],[0,2,-1],[1.5,0,-1.5],[-1.5,0,1.5]].forEach(([x,y,z]) => { const n = new THREE.Mesh(new THREE.SphereGeometry(0.2,6,4), sm.clone()); n.position.set(x,y,z); m.network.add(n); });
    const lm = new THREE.LineBasicMaterial({color:0xc8a060,transparent:true,opacity:0.3});
    const np = [[0,0,0],[2,1,0],[-2,1,0],[1,-1,1],[-1,-1,-1],[0,2,-1],[1.5,0,-1.5],[-1.5,0,1.5]];
    for(let i=0;i<np.length;i++)for(let j=i+1;j<np.length;j++){const d=Math.sqrt((np[i][0]-np[j][0])**2+(np[i][1]-np[j][1])**2+(np[i][2]-np[j][2])**2);if(d<3){m.network.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...np[i]),new THREE.Vector3(...np[j])]),lm));}}
    m.signal = new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.3, 64, 8, 2, 3), wm.clone());
    m.crisis = new THREE.Group();
    for(let i=0;i<8;i++){const f=new THREE.Mesh(new THREE.TetrahedronGeometry(0.4+Math.random()*0.3,0),new THREE.MeshStandardMaterial({color:0xc86050,wireframe:true,transparent:true,opacity:0.6}));const a=(i/8)*Math.PI*2;f.position.set(Math.cos(a)*1.2,Math.sin(a)*1.2,(Math.random()-0.5)*0.5);f.userData={angle:a,radius:1.2,speed:0.5+Math.random()*0.5};m.crisis.add(f);}
    m.ending = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 0), sm.clone());

    let cur = null, tgt = 'room';
    const cm = {room:'#c8a060',chat:'#a8b8c8',history:'#c8a060',cosmic:'#b8a8c8',quantum:'#a8b8c8',crisis:'#c86050',ending:'#a0c8a0'};

    window.set3dScene = function(name) {
        if (name === tgt) return;
        if (cur) scene3d.remove(cur);
        tgt = name;
        cur = m[name] || m.room;
        scene3d.add(cur);
        el.style.color = cm[name] || '#c8a060';
    };
    window.set3dScene('room');

    const clock = new THREE.Clock();
    (function loop() {
        requestAnimationFrame(loop);
        const t = clock.getElapsedTime();
        if (cur) {
            cur.rotation.y = t * 0.3;
            cur.rotation.x = Math.sin(t * 0.2) * 0.2;
            if (tgt==='agent_anomaly' && cur.children) { cur.children[0].rotation.y=t*0.5; cur.children[1].rotation.z=t*0.8; const s=1+Math.sin(t*2)*0.1; cur.children[1].scale.set(s,s,s); }
            else if (tgt==='crisis' && cur.children) { cur.children.forEach(f=>{const a=f.userData.angle+t*f.userData.speed;const r=f.userData.radius+Math.sin(t*3+f.userData.angle)*0.3;f.position.set(Math.cos(a)*r,Math.sin(a)*r,f.position.z);f.rotation.x=t*f.userData.speed*2;}); }
            else if (tgt==='temple') { cur.rotation.y=t*0.1+Math.PI/4; }
            else if (tgt==='network') { cur.rotation.y=t*0.15; cur.rotation.x=Math.sin(t*0.1)*0.3; }
        }
        camera3d.position.x = Math.sin(t*0.15)*0.5;
        camera3d.position.y = Math.cos(t*0.1)*0.3;
        camera3d.lookAt(0, 0, 0);
        asciiEffect.render(scene3d, camera3d);
    })();

    window.addEventListener('resize', () => {
        camera3d.aspect = window.innerWidth / window.innerHeight;
        camera3d.updateProjectionMatrix();
        renderer3d.setSize(window.innerWidth, window.innerHeight);
        asciiEffect.setSize(window.innerWidth, window.innerHeight);
    });
    console.log('3D ASCII overlay loaded');
} catch(e) { console.warn('3D ASCII overlay failed:', e.message); }

    function renderAsciiArt(name) {
        const piece = asciiArt[name];
        if (!piece) return null;
        const el = document.createElement('pre');
        el.className = 'ascii-art ' + (piece.theme || '');
        el.textContent = piece.art;
        return el;
    }

    // Detect which ASCII art to show from story text
    function detectAsciiArt(text) {
        const t = text.toLowerCase();
        // Check for explicit tags first: [art: name]
        const tagMatch = text.match(/\[art:\s*(\w+)\]/i);
        if (tagMatch && asciiArt[tagMatch[1]]) return tagMatch[1];

        // Auto-detect from content
        if (t.includes('laptop') || t.includes('screen flickers') || t.includes('apartment')) return 'desk';
        if (t.includes('river city') || t.includes('market') || t.includes('streets')) return 'city';
        if (t.includes('temple') || t.includes('chant-master') || t.includes('granar')) return 'temple';
        if (t.includes('meshwork') || t.includes('network') || t.includes('surplus flow')) return 'network';
        if (t.includes('neganthropomorph') || t.includes('perpendicular') || t.includes('signal from')) return 'signal';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) return 'crisis';
        if (t.includes('cosmic') && (t.includes('awareness') || t.includes('dream'))) return 'signal';
        if (t.includes('agent') && t.includes('outputs')) return 'agent';
        if (t.includes('agent') && (t.includes('dream') || t.includes('strange') || t.includes('anomal'))) return 'agent_anomaly';
        return null;
    }

    // Track last shown art to avoid repetition
    let lastArt = '';

    // ===== PARTICLES =====
    const pCanvas = $('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let particles = [];
    let pHue = { r: 200, g: 160, b: 96 };

    function resizeCanvas() {
        pCanvas.width = window.innerWidth;
        pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() { this.reset(true); }
        reset(init) {
            this.x = Math.random() * pCanvas.width;
            this.y = init ? Math.random() * pCanvas.height : pCanvas.height + 10;
            this.size = Math.random() * 1.8 + 0.4;
            this.vx = (Math.random() - 0.5) * 0.25;
            this.vy = -(Math.random() * 0.15 + 0.05);
            this.alpha = Math.random() * 0.3 + 0.05;
            this.phase = Math.random() * Math.PI * 2;
        }
        update(t) {
            this.x += this.vx + Math.sin(t * 0.0008 + this.phase) * 0.08;
            this.y += this.vy;
            if (this.y < -10 || this.x < -10 || this.x > pCanvas.width + 10) this.reset(false);
        }
        draw() {
            const { r, g, b } = pHue;
            pCtx.beginPath();
            pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            pCtx.fillStyle = `rgba(${r},${g},${b},${this.alpha})`;
            pCtx.fill();
        }
    }

    const pCount = Math.min(60, Math.floor((pCanvas.width * pCanvas.height) / 20000));
    for (let i = 0; i < pCount; i++) particles.push(new Particle());

    function animateParticles(t) {
        pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
        particles.forEach(p => { p.update(t); p.draw(); });
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const d = Math.sqrt(dx*dx + dy*dy);
                if (d < 100) {
                    pCtx.beginPath();
                    pCtx.moveTo(particles[i].x, particles[i].y);
                    pCtx.lineTo(particles[j].x, particles[j].y);
                    pCtx.strokeStyle = `rgba(${pHue.r},${pHue.g},${pHue.b},${(1 - d/100) * 0.04})`;
                    pCtx.lineWidth = 0.5;
                    pCtx.stroke();
                }
            }
        }
        requestAnimationFrame(animateParticles);
    }
    requestAnimationFrame(animateParticles);

    // ===== SCENE DETECTION =====
    function setScene(text) {
        const t = text.toLowerCase();
        let name = 'room';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) name = 'crisis';
        else if (t.includes('cosmic') || t.includes('neganthropomorph') || t.includes('perpendicular')) name = 'cosmic';
        else if (t.includes('quantum') || t.includes('telepathy') || t.includes('psionic') || t.includes('magick')) name = 'quantum';
        else if (t.includes('river city') || t.includes('granar') || t.includes('temple') || t.includes('chant-master') ||
                 t.includes('feudal') || t.includes('colonial') || t.includes('teotihuacan')) name = 'history';
        else if (t.includes('chat') || t.includes('agent') || t.includes('output') || t.includes('prompt')) name = 'chat';

        if (name === currentScene) return;
        currentScene = name;
        sceneEl.className = 'scene-' + name;

        // Update 3D ASCII scene to match
        const art3dMap = {
            room: 'room', chat: 'agent', history: 'temple',
            cosmic: 'signal', quantum: 'network', crisis: 'crisis', ending: 'ending'
        };
        const art3d = art3dMap[name] || 'room';
        if (window.set3dScene) window.set3dScene(art3d);

        const hueMap = {
            room: { r: 200, g: 160, b: 96 },
            chat: { r: 168, g: 184, b: 200 },
            history: { r: 200, g: 160, b: 120 },
            cosmic: { r: 184, g: 168, b: 200 },
            quantum: { r: 168, g: 184, b: 200 },
            crisis: { r: 200, g: 120, b: 100 },
        };
        if (hueMap[name]) pHue = hueMap[name];
    }

    // ===== RENDER STORY =====
    function renderStory() {
        let paragraphs = [];
        while (story.canContinue) {
            let text = story.Continue();
            if (text && text.trim()) paragraphs.push(text.trim());
        }

        if (paragraphs.length === 0) {
            if (story.currentChoices.length > 0) showChoices();
            else if (!story.canContinue) showEnding();
            return;
        }

        // Scene detection
        const fullText = paragraphs.join(' ');
        setScene(fullText);

        // ASCII art detection
        const artName = detectAsciiArt(fullText);
        if (artName && artName !== lastArt) {
            lastArt = artName;
            const artEl = renderAsciiArt(artName);
            if (artEl) storyContent.appendChild(artEl);
        }

        // Build section
        const section = document.createElement('div');
        section.className = 'story-section';

        paragraphs.forEach(p => {
            // Section headers (-- TITLE --)
            const headerMatch = p.match(/^--\s*(.+?)\s*--$/);
            if (headerMatch) {
                const hdr = document.createElement('div');
                hdr.className = 'section-header';
                hdr.textContent = headerMatch[1];
                section.appendChild(hdr);
                return;
            }

            // Agent dialogue (quoted)
            if (p.startsWith('"') && p.endsWith('"') && p.length > 30) {
                const el = document.createElement('p');
                el.className = 'agent-text';
                el.textContent = p.slice(1, -1);
                section.appendChild(el);
                addToLog('the agent', p.slice(1, -1));
                return;
            }

            // Player/narrator text
            const el = document.createElement('p');
            el.className = 'narrator-text';
            el.textContent = p;
            section.appendChild(el);
            addToLog('', p);
        });

        storyContent.appendChild(section);

        // Scroll to the start of the new section
        requestAnimationFrame(() => {
            scrollToElement(section);
        });

        // Show choices if available
        if (story.currentChoices.length > 0) {
            showChoices();
        } else if (!story.canContinue) {
            showEnding();
        }
    }

    // ===== CHOICES =====
    function showChoices() {
        choicesInner.innerHTML = '';
        choicesArea.classList.add('open');
        updateScrollHint();

        story.currentChoices.forEach((choice, i) => {
            const card = document.createElement('div');
            card.className = 'choice-card';
            card.innerHTML = `<span class="choice-text">${choice.text}</span><span class="choice-index">&rarr;</span>`;
            card.addEventListener('click', () => {
                choicesArea.classList.remove('open');
                story.ChooseChoiceIndex(i);
                addToLog('You', choice.text);

                // Show player's choice in story
                const choiceSection = document.createElement('div');
                choiceSection.className = 'story-section';
                const el = document.createElement('p');
                el.className = 'player-text';
                el.style.color = 'var(--accent)';
                el.textContent = '> ' + choice.text;
                choiceSection.appendChild(el);
                storyContent.appendChild(choiceSection);

                setTimeout(() => {
                    renderStory();
                }, 150);
            });
            choicesInner.appendChild(card);
        });

        // Scroll so new text before choices is visible
        requestAnimationFrame(() => {
            const lastSection = storyContent.lastElementChild;
            if (lastSection) scrollToElement(lastSection);
        });
    }

    // ===== ENDING =====
    function showEnding() {
        endingReached = true;
        // Find ending title from recent log
        const recent = historyLog.slice(-20);
        let title = 'THE END';
        let body = [];

        for (let i = recent.length - 1; i >= 0; i--) {
            const t = recent[i].text.trim();
            if (t === t.toUpperCase() && t.length > 3 && t.length < 60 && !t.includes(':')) {
                title = t;
                break;
            }
            body.unshift(t);
        }
        if (body.length === 0) body = ['The story has ended.'];

        $('ending-title').textContent = title;
        $('ending-body').textContent = body.join(' ').slice(0, 2000);
        $('ending-overlay').classList.add('open');
        sceneEl.className = 'scene-ending';
    }

    // ===== LOG =====
    function addToLog(speaker, text) {
        historyLog.push({ speaker, text });
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (speaker === 'the agent' ? ' agent-entry' : '');
        if (speaker) {
            const tag = document.createElement('div');
            tag.className = 'speaker-tag';
            tag.textContent = speaker;
            entry.appendChild(tag);
        }
        const content = document.createElement('div');
        content.textContent = text;
        entry.appendChild(content);
        historyPanel.appendChild(entry);
    }

    // ===== STATS =====
    function updateStats() {
        if (!story) return;
        const vars = story.variablesState;
        const sections = [
            { label: 'Capabilities', stats: ['reading', 'weaving', 'play', 'craft', 'nerve', 'swarm'] },
            { label: 'Resources', stats: ['time_remaining', 'attention', 'credibility', 'stealth'] },
            { label: 'Cosmic', stats: ['entropiric_saturation', 'neganthropomorphic_signal', 'cosmic_awareness'] },
            { label: 'Quantum', stats: ['quantum_telepathy', 'psionic_perception', 'magickal_discipline'] },
            { label: 'Meshwork', stats: ['meshwork_resilience', 'operational_tempo', 'public_initiative'] },
            { label: 'Agent', stats: ['agent_classical_strength', 'agent_generative_strength', 'agent_autonomy', 'augmentation_fidelity'] },
            { label: 'Factions', stats: ['faction_ledger', 'faction_blade', 'faction_veil', 'faction_commons', 'faction_mesh', 'faction_playhouse'] }
        ];

        let html = '<h3>Character Sheet</h3>';
        sections.forEach(sec => {
            html += `<div class="stat-group"><div class="stat-group-label">${sec.label}</div>`;
            sec.stats.forEach(stat => {
                try {
                    const val = vars[stat];
                    if (val !== undefined && val !== null) {
                        const n = typeof val === 'number' ? val : 0;
                        const max = stat.includes('faction') ? 100 : 20;
                        const pct = Math.min(100, Math.max(0, (n / max) * 100));
                        html += `<div class="stat-row"><span class="stat-name">${stat.replace(/_/g, ' ')}</span><span><span class="stat-value">${n}</span><span class="stat-bar-track"><span class="stat-bar-fill" style="width:${pct}%"></span></span></span></div>`;
                    }
                } catch(e) {}
            });
            html += '</div>';
        });
        statsPanel.innerHTML = html;
    }

    // ===== EVENT HANDLERS =====
    let statsOpen = false;
    $('stats-btn').addEventListener('click', () => {
        statsOpen = !statsOpen;
        if (statsOpen) { updateStats(); statsPanel.classList.add('open'); }
        else statsPanel.classList.remove('open');
    });

    let logOpen = false;
    $('log-btn').addEventListener('click', () => {
        logOpen = !logOpen;
        if (logOpen) {
            historyPanel.classList.add('open');
            $('history-close').style.display = 'block';
            historyPanel.scrollTop = historyPanel.scrollHeight;
        } else {
            historyPanel.classList.remove('open');
            $('history-close').style.display = 'none';
        }
    });

    $('history-close').addEventListener('click', () => {
        logOpen = false;
        historyPanel.classList.remove('open');
        $('history-close').style.display = 'none';
    });

    // ===== LOAD =====
    async function loadStory() {
        try {
            const resp = await fetch('inkle/story.json');
            if (!resp.ok) throw new Error('Could not load story.json: ' + resp.status);
            const json = await resp.json();
            if (typeof inkjs === 'undefined') throw new Error('inkjs not loaded');
            story = new inkjs.Story(json);
            $('loading-screen').classList.add('hidden');
            setTimeout(() => $('loading-screen').style.display = 'none', 1000);
            renderStory();
        } catch (err) {
            $('loading-screen').textContent = 'Error: ' + err.message;
            console.error(err);
        }
    }

    loadStory();
</script>
</body>
</html>
