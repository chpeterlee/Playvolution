<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playvolution</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- Background layers -->
<div id="scene" class="scene-room"></div>
<div id="vignette"></div>
<div id="p5-canvas"></div>

<!-- Loading -->
<div id="loading-screen">Loading...</div>

<!-- Main app -->
<div id="app">
    <!-- Top bar -->
    <div id="top-bar">
        <button class="top-btn" id="log-btn">LOG</button>
        <button class="top-btn" id="stats-btn">STATS</button>
        <button class="top-btn" id="audio-btn">MUSIC</button>
        <div id="volume-slider">
            <input type="range" id="volume-range" min="0" max="1" step="0.05" value="0.7">
        </div>
    </div>

    <!-- Scrollable story text -->
    <div id="story-area">
        <div id="story-inner">
            <div id="game-title">
                <h1>PLAYVOLUTION</h1>
                <div class="divider"></div>
                <div class="subtitle">surplus &middot; signal &middot; the thing that plays back</div>
            </div>
            <div id="story-content"></div>
        </div>
    </div>

    <!-- Scroll-down hint -->
    <div id="scroll-down-hint">&#x25BC;</div>

    <!-- Pinned bottom choices -->
    <div id="choices-area">
        <div id="choices-inner"></div>
    </div>
</div>

<!-- Overlays -->
<div id="stats-panel"></div>
<div id="history-panel"></div>
<button id="history-close" style="display:none">CLOSE</button>
<div id="ending-overlay">
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-body" id="ending-body"></div>
</div>

<script src="https://unpkg.com/inkjs@2.4.0/dist/ink.js"></script>
<script src="https://unpkg.com/@strudel/web@1.3.0"></script>

<script src="js/audio-engine.js"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="js/p5-background.js"></script>


<script src="js/ascii-art.js"></script>
<script src="js/tooltips.js"></script>

<script>
    // ===== STATE =====
    let story = null;
    let historyLog = [];
    let currentScene = 'room';
    let endingReached = false;

    // ===== DOM =====
    const $ = id => document.getElementById(id);
    const sceneEl = $('scene');
    const storyArea = $('story-area');
    const storyContent = $('story-content');
    const choicesArea = $('choices-area');
    const choicesInner = $('choices-inner');
    const historyPanel = $('history-panel');
    const statsPanel = $('stats-panel');
    const scrollHint = $('scroll-down-hint');

    // Scroll hint: show when there's unread text below
    function updateScrollHint() {
        const hasScroll = storyArea.scrollHeight > storyArea.clientHeight + 20;
        const atBottom = (storyArea.scrollHeight - storyArea.scrollTop - storyArea.clientHeight) < 30;
        const show = hasScroll && !atBottom;

        // Position just above the choices pane
        if (choicesArea.classList.contains('open')) {
            scrollHint.style.bottom = (choicesArea.offsetHeight + 8) + 'px';
        } else {
            scrollHint.style.bottom = '14px';
        }

        if (show) {
            scrollHint.classList.add('visible');
        } else {
            scrollHint.classList.remove('visible');
        }
    }

    storyArea.addEventListener('scroll', updateScrollHint);
    window.addEventListener('resize', updateScrollHint);

    // Scroll story area to show a specific element at the top
    function scrollToElement(el) {
        if (!el) return;
        const offset = el.offsetTop - storyArea.offsetTop;
        storyArea.scrollTo({ top: Math.max(0, offset - 10), behavior: 'smooth' });
        // Check hint after scroll settles
        setTimeout(updateScrollHint, 600);
        setTimeout(updateScrollHint, 1200);
    }


    // ===== SCENE DETECTION =====
    // Priority 1: ink tags (# scene:name)
    // Priority 2: text keyword fallback
    function setSceneFromTags(tags) {
        for (const tag of tags) {
            const sceneMatch = tag.match(/^scene:(\w+)$/);
            if (sceneMatch) {
                const name = sceneMatch[1];
                if (name !== currentScene) {
                    currentScene = name;
                    sceneEl.className = 'scene-' + name;
                    if (window.setP5Scene) window.setP5Scene(name);
                    window._currentScene = name;
                    if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
                        window.playSceneMusic(name);
                    }
                }
                return true;
            }
        }
        return false;
    }

    function processSfxTags(tags) {
        for (const tag of tags) {
            const sfxMatch = tag.match(/^sfx:(\w+)$/);
            if (sfxMatch && window.playSfx) {
                window.playSfx(sfxMatch[1]);
            }
        }
    }

    function setScene(text) {
        const t = text.toLowerCase();
        let name = 'room';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) name = 'crisis';
        else if (t.includes('cosmic') || t.includes('neganthropomorph') || t.includes('perpendicular')) name = 'cosmic';
        else if (t.includes('quantum') || t.includes('telepathy') || t.includes('psionic') || t.includes('magick')) name = 'quantum';
        else if (t.includes('river city') || t.includes('granar') || t.includes('temple') || t.includes('chant-master') ||
                 t.includes('feudal') || t.includes('colonial') || t.includes('teotihuacan')) name = 'history';
        else if (t.includes('chat') || t.includes('agent') || t.includes('output') || t.includes('prompt')) name = 'chat';

        if (name === currentScene) return;
        currentScene = name;
        sceneEl.className = 'scene-' + name;

        // Update p5.js generative visuals to match
        if (window.setP5Scene) window.setP5Scene(name);

        // Update dynamic music to match scene
        window._currentScene = name;
        if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
            window.playSceneMusic(name);
        }
    }

    // ===== RENDER STORY =====
    function renderStory() {
        let paragraphs = [];
        let allTags = [];
        while (story.canContinue) {
            let text = story.Continue();
            if (text && text.trim()) paragraphs.push(text.trim());
            // Collect ink tags
            if (story.currentTags && story.currentTags.length > 0) {
                allTags.push(...story.currentTags);
            }
        }

        if (paragraphs.length === 0) {
            if (story.currentChoices.length > 0) showChoices();
            else if (!story.canContinue) showEnding();
            return;
        }

        // Process SFX tags first (e.g., # sfx:companion, # sfx:ending_resolve)
        const fullText = paragraphs.join(' ');
        if (allTags.length > 0) {
            processSfxTags(allTags);
            // Scene detection: try ink tags first, fall back to text keywords
            if (!setSceneFromTags(allTags)) {
                setScene(fullText);
            }
        } else {
            // Fallback to text keyword detection
            setScene(fullText);
        }

        // ASCII art detection
        const artName = detectAsciiArt(fullText);
        if (artName && artName !== lastArt) {
            lastArt = artName;
            const artEl = renderAsciiArt(artName);
            if (artEl) storyContent.appendChild(artEl);
        }

        // Build section
        const section = document.createElement('div');
        section.className = 'story-section';

        // Detect stat-dump lines from ink: -- StatName:Value ... -- or "Choose your focus:"
        const statLinePattern = /^--\s*\w[\w\s-]*:\d+.*--$/;
        const focusPromptPattern = /^Choose your focus/i;
        let isFocusTurn = false;
        let hasStatDump = false;

        paragraphs.forEach(p => {
            // Stat-dump lines (-- Read:6 Weave:2 ... --)
            if (statLinePattern.test(p)) {
                hasStatDump = true;
                return; // suppress
            }

            // "Choose your focus:" prompt
            if (focusPromptPattern.test(p)) {
                isFocusTurn = true;
                return; // suppress
            }

            // Section headers (-- TITLE --)
            const headerMatch = p.match(/^--\s*(.+?)\s*--$/);
            if (headerMatch) {
                const hdr = document.createElement('div');
                hdr.className = 'section-header';
                hdr.textContent = headerMatch[1];
                section.appendChild(hdr);
                return;
            }

            // Agent dialogue (quoted)
            if (p.startsWith('"') && p.endsWith('"') && p.length > 30) {
                const el = document.createElement('p');
                el.className = 'agent-text';
                el.textContent = p.slice(1, -1);
                section.appendChild(el);
                addToLog('the agent', p.slice(1, -1));
                return;
            }

            // Player/narrator text
            const el = document.createElement('p');
            el.className = 'narrator-text';
            el.textContent = p;
            section.appendChild(el);
            addToLog('', p);
        });

        storyContent.appendChild(section);

        // Check if upcoming choices look like focus choices
        if (!isFocusTurn && story.currentChoices.length > 0) {
            isFocusTurn = story.currentChoices.some(c =>
                /\[.*\]\s*-\s*(Use your|Map who|Recruit|Launch|Push|Cultivate|Build|Decode|Deepen)/.test(c.text)
            );
        }

        // Stat dump detected on a focus turn: suppress raw lines, save snapshot for next turn
        if (hasStatDump && isFocusTurn) {
            // Save current snapshot so we can compute deltas after the focus choice
            deferredStatSnapshot = Object.assign({}, prevStatSnapshot);
            pendingFocusStats = true;
        }

        // After a focus choice was made, render the deferred stats block
        if (pendingFocusStats && !hasStatDump) {
            renderInlineStats(section);
            pendingFocusStats = false;
            deferredStatSnapshot = null;
        }

        // Always update the snapshot so changes accumulate correctly
        prevStatSnapshot = snapshotStats() || prevStatSnapshot;

        // Feed game variables to music modulation after each story beat
        if (window.applyGameModulation) {
            try { window.applyGameModulation(story.variablesState); } catch(e) {}
        }

        // Scroll to the start of the new section
        requestAnimationFrame(() => {
            scrollToElement(section);
        });

        // Show choices if available
        if (story.currentChoices.length > 0) {
            showChoices();
        } else if (!story.canContinue) {
            showEnding();
        }
    }

    // ===== CHOICES =====

    function showChoices() {
        choicesInner.innerHTML = '';
        choicesArea.classList.add('open');
        updateScrollHint();

        story.currentChoices.forEach((choice, i) => {
            const card = document.createElement('div');
            card.className = 'choice-card';
            const tooltip = getChoiceTooltip(choice.text);
            const emojiHtml = tooltip ? `<span class="choice-emoji">${tooltip.emoji}</span>` : '';
            const tooltipHtml = tooltip ? `<div class="choice-tooltip">${tooltip.tooltip}</div>` : '';
            card.innerHTML = `<span class="choice-text">${emojiHtml}${choice.text}</span><span class="choice-index">&rarr;</span>${tooltipHtml}`;
            card.addEventListener('click', () => {
                choicesArea.classList.remove('open');
                // Play choice SFX
                if (window.playSfx) window.playSfx('choice');
                story.ChooseChoiceIndex(i);
                addToLog('You', choice.text);

                // Show player's choice in story
                const choiceSection = document.createElement('div');
                choiceSection.className = 'story-section';
                const el = document.createElement('p');
                el.className = 'player-text';
                el.style.color = 'var(--accent)';
                el.textContent = '> ' + choice.text;
                choiceSection.appendChild(el);
                storyContent.appendChild(choiceSection);

                setTimeout(() => {
                    renderStory();
                }, 150);
            });
            choicesInner.appendChild(card);
        });

        // Scroll so new text before choices is visible
        requestAnimationFrame(() => {
            const lastSection = storyContent.lastElementChild;
            if (lastSection) scrollToElement(lastSection);
        });
    }

    // ===== ENDING =====
    function showEnding() {
        endingReached = true;

        // Switch to ending scene music
        window._currentScene = 'ending';
        if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
            window.playSceneMusic('ending');
        }
        if (window.setP5Scene) window.setP5Scene('ending');
        if (window.playSfx) window.playSfx('ending_resolve');

        // Find ending title from recent log
        const recent = historyLog.slice(-20);
        let title = 'THE END';
        let body = [];

        for (let i = recent.length - 1; i >= 0; i--) {
            const t = recent[i].text.trim();
            if (t === t.toUpperCase() && t.length > 3 && t.length < 60 && !t.includes(':')) {
                title = t;
                break;
            }
            body.unshift(t);
        }
        if (body.length === 0) body = ['The story has ended.'];

        $('ending-title').textContent = title;
        $('ending-body').textContent = body.join(' ').slice(0, 2000);
        $('ending-overlay').classList.add('open');
        sceneEl.className = 'scene-ending';
    }

    // ===== LOG =====
    function addToLog(speaker, text) {
        historyLog.push({ speaker, text });
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (speaker === 'the agent' ? ' agent-entry' : '');
        if (speaker) {
            const tag = document.createElement('div');
            tag.className = 'speaker-tag';
            tag.textContent = speaker;
            entry.appendChild(tag);
        }
        const content = document.createElement('div');
        content.textContent = text;
        entry.appendChild(content);
        historyPanel.appendChild(entry);
    }

    // ===== STATS =====
    // === Two-level stat taxonomy ===
    // Categories are thematic groupings shown as section headers.
    // Each category contains sub-groups (the original groupings).
    // This keeps backward-compatible keys for CSS while adding readable hierarchy.

    const statCategories = [
        {
            id: 'personal',
            label: 'Personal',
            desc: 'Your capabilities and resources in the field',
            groups: [
                {
                    key: 'capabilities', label: 'Skills',
                    css: 'g-capabilities',
                    desc: 'Core competencies you develop through choices',
                    stats: [
                        { id: 'reading',  name: 'Reading',  max: 20, icon: '\u{1F4D6}', tip: 'Ability to decode hidden patterns' },
                        { id: 'weaving',  name: 'Weaving',  max: 20, icon: '\u{1FAA1}', tip: 'Connecting disparate threads together' },
                        { id: 'play',     name: 'Play',     max: 20, icon: '\u{1F3AE}', tip: 'Creative experimentation and risk' },
                        { id: 'craft',    name: 'Craft',    max: 20, icon: '\u{1F528}', tip: 'Building and refining artifacts' },
                        { id: 'nerve',    name: 'Nerve',    max: 20, icon: '\u{26A1}',  tip: 'Courage under pressure' },
                        { id: 'swarm',    name: 'Swarm',    max: 20, icon: '\u{1F41B}', tip: 'Coordinating distributed agents' }
                    ]
                },
                {
                    key: 'resources', label: 'Assets',
                    css: 'g-resources',
                    desc: 'Finite resources you must manage each chapter',
                    stats: [
                        { id: 'time_remaining', name: 'Time',       max: 10,  icon: '\u{23F3}', tip: 'Turns remaining this chapter' },
                        { id: 'attention',      name: 'Attention',  max: 10,  icon: '\u{1F441}', tip: 'Focus capacity per turn' },
                        { id: 'credibility',    name: 'Credibility', max: 100, icon: '\u{1F4E2}', tip: 'How much others trust you' },
                        { id: 'stealth',        name: 'Stealth',    max: 100, icon: '\u{1F575}', tip: 'Visibility to hostile actors' }
                    ]
                }
            ]
        },
        {
            id: 'transcendent',
            label: 'Transcendent',
            desc: 'Metaphysical and cosmic evolution',
            groups: [
                {
                    key: 'cosmic', label: 'Cosmic Field',
                    css: 'g-cosmic',
                    desc: 'The macro-forces shaping reality',
                    stats: [
                        { id: 'entropiric_saturation',    name: 'Entropic Sat.',     max: 100, icon: '\u{1F31F}', tip: 'How much the Entropire has saturated' },
                        { id: 'neganthropomorphic_signal', name: 'Neg. Signal',       max: 100, icon: '\u{1F4E1}', tip: 'Signal strength from the counter-future' },
                        { id: 'cosmic_awareness',          name: 'Cosmic Awareness',  max: 15,  icon: '\u{1F52E}', tip: 'Perception of non-classical reality' }
                    ]
                },
                {
                    key: 'quantum', label: 'Quantum Capacities',
                    css: 'g-quantum',
                    desc: 'Non-classical abilities emerging through play',
                    stats: [
                        { id: 'quantum_telepathy',  name: 'Telepathy',  max: 10, icon: '\u{1F9E0}', tip: 'Direct mind-to-mind communication' },
                        { id: 'psionic_perception', name: 'Psionics',   max: 10, icon: '\u{1F443}', tip: 'Sensing beyond ordinary perception' },
                        { id: 'magickal_discipline',name: 'Magick',     max: 10, icon: '\u{2728}',  tip: 'Disciplined manipulation of reality' }
                    ]
                }
            ]
        },
        {
            id: 'collective',
            label: 'Collective',
            desc: 'Your network and AI partner',
            groups: [
                {
                    key: 'meshwork', label: 'Meshwork',
                    css: 'g-meshwork',
                    desc: 'The health and speed of your distributed network',
                    stats: [
                        { id: 'meshwork_resilience', name: 'Resilience', max: 100, icon: '\u{1F310}', tip: 'Network robustness against attack' },
                        { id: 'operational_tempo',   name: 'Tempo',      max: 100, icon: '\u{1F3B5}', tip: 'Speed of adaptation vs institutions' },
                        { id: 'public_initiative',   name: 'Initiative', max: 100, icon: '\u{1F680}', tip: 'Momentum for public-facing action' }
                    ]
                },
                {
                    key: 'agent', label: 'Agent',
                    css: 'g-agent',
                    desc: 'Your AI companion\u2019s capabilities and autonomy',
                    stats: [
                        { id: 'agent_classical_strength',   name: 'Classical',   max: 100, icon: '\u{1F916}', tip: 'Deterministic reasoning power' },
                        { id: 'agent_generative_strength',  name: 'Generative',  max: 100, icon: '\u{2728}',  tip: 'Creative and emergent capacity' },
                        { id: 'agent_autonomy',             name: 'Autonomy',    max: 10,  icon: '\u{1F513}', tip: 'Independence from your control' },
                        { id: 'augmentation_fidelity',      name: 'Fidelity',    max: 100, icon: '\u{1F3AF}', tip: 'How well agent augments your intent' }
                    ]
                }
            ]
        },
        {
            id: 'political',
            label: 'Political',
            desc: 'Standing with the six factions',
            groups: [
                {
                    key: 'factions', label: 'Factions',
                    css: 'g-factions',
                    desc: 'Your reputation with each faction (0\u2013100)',
                    stats: [
                        { id: 'faction_ledger',    name: 'Ledger',    max: 100, icon: '\u{1F4B0}', tip: 'The financial arbitrage brokers' },
                        { id: 'faction_blade',     name: 'Blade',     max: 100, icon: '\u{1F5E1}', tip: 'The direct-action operators' },
                        { id: 'faction_veil',      name: 'Veil',      max: 100, icon: '\u{1F3AD}', tip: 'The narrative-shaping artists' },
                        { id: 'faction_commons',   name: 'Commons',   max: 100, icon: '\u{1F33F}', tip: 'The cooperative mutualists' },
                        { id: 'faction_mesh',      name: 'Mesh',      max: 100, icon: '\u{1F578}', tip: 'The network weavers' },
                        { id: 'faction_playhouse', name: 'Playhouse', max: 100, icon: '\u{1F3B2}', tip: 'The game-design revolutionaries' }
                    ]
                }
            ]
        }
    ];

    // Flat lookup used by renderInlineStats and snapshot helpers
    const statConfig = {};
    statCategories.forEach(cat => {
        cat.groups.forEach(grp => {
            statConfig[grp.key] = { label: grp.label, key: grp.css, desc: grp.desc, stats: grp.stats };
        });
    });

    // --- Snapshot previous stat values for change detection ---
    let prevStatSnapshot = {};
    let pendingFocusStats = false;
    let deferredStatSnapshot = null;
    function snapshotStats() {
        if (!story) return;
        const vars = story.variablesState;
        const snap = {};
        Object.values(statConfig).forEach(sec => {
            sec.stats.forEach(stat => {
                try {
                    const raw = vars[stat.id];
                    snap[stat.id] = (typeof raw === 'number') ? raw : 0;
                } catch(e) { snap[stat.id] = 0; }
            });
        });
        return snap;
    }
    // Take initial snapshot
    prevStatSnapshot = snapshotStats() || {};

    // --- Build an inline stats block replacing the ink stat dump ---
    // Shows ALL stats grouped by category with delta indicators for changes
    // Called AFTER a focus choice is made, using deferred snapshot for accurate deltas
    function renderInlineStats(container) {
        if (!story) return;
        const vars = story.variablesState;

        // Use deferred snapshot (saved when stat dump was detected) for delta comparison
        const compareSnap = deferredStatSnapshot || prevStatSnapshot;

        let html = '';
        let hasAnyStats = false;

        statCategories.forEach(cat => {
            let catHtml = '';

            cat.groups.forEach(grp => {
                let groupItems = [];

                grp.stats.forEach(stat => {
                    const raw = vars[stat.id];
                    if (raw === undefined || raw === null) return;
                    const n = (typeof raw === 'number') ? raw : 0;
                    const prev = compareSnap[stat.id] || 0;
                    const delta = n - prev;

                    hasAnyStats = true;
                    const tipAttr = stat.tip ? ` title="${stat.tip}"` : '';

                    // Show delta badge only if changed
                    let deltaHtml = '';
                    if (delta !== 0) {
                        const cls = delta > 0 ? 'positive' : 'negative';
                        const sign = delta > 0 ? '+' : '';
                        deltaHtml = `<span class="stat-inline-delta ${cls}">${sign}${delta}</span>`;
                    }

                    groupItems.push(`<span class="stat-inline ${grp.css}"${tipAttr}><span class="stat-inline-icon">${stat.icon}</span><span class="stat-inline-name">${stat.name}</span><span class="stat-inline-val">${n}</span>${deltaHtml}</span>`);
                });

                if (groupItems.length > 0) {
                    catHtml += `<div class="stat-inline-group-label cat-${cat.id}">${grp.label}</div>`;
                    catHtml += groupItems.join('');
                }
            });

            if (catHtml) {
                html += `<div class="stat-inline-cat cat-${cat.id}"><span class="stat-inline-cat-name">${cat.label}</span><span class="stat-inline-cat-desc">${cat.desc}</span></div>`;
                html += catHtml;
                html += '<div class="stat-inline spacer"></div>';
            }
        });

        // Only render if we have stats to show
        if (hasAnyStats) {
            const block = document.createElement('div');
            block.className = 'stats-block';
            block.innerHTML = '<div class="stats-block-title">Status Report</div>' + html;
            container.appendChild(block);
        }

        // Update snapshot for next comparison
        prevStatSnapshot = newSnap;
    }

    function updateStats() {
        if (!story) return;
        const vars = story.variablesState;
        const chapter = vars.chapter || 1;
        const score = vars.playvolution_score || 0;

        let html = `<h3>Character Sheet</h3>`;
        html += `<div class="stat-chapter-marker">Chapter ${chapter} &middot; Score ${score}</div>`;

        statCategories.forEach(cat => {
            // Category header
            html += `<div class="stat-category cat-${cat.id}">`;
            html += `<div class="stat-category-header">`;
            html += `<span class="stat-category-name">${cat.label}</span>`;
            html += `<span class="stat-category-desc">${cat.desc}</span>`;
            html += `</div>`;

            cat.groups.forEach(grp => {
                html += `<div class="stat-group ${grp.css}">`;
                html += `<div class="stat-group-label" title="${grp.desc || ''}">${grp.label}</div>`;
                grp.stats.forEach(stat => {
                    try {
                        const raw = vars[stat.id];
                        if (raw !== undefined && raw !== null) {
                            const n = typeof raw === 'number' ? raw : 0;
                            const pct = Math.min(100, Math.max(0, (n / stat.max) * 100));
                            const highClass = (pct >= 70) ? ' stat-high' : '';
                            const tipAttr = stat.tip ? ` title="${stat.tip}"` : '';
                            html += `<div class="stat-row"${tipAttr}>
                                <span class="stat-name">${stat.icon} ${stat.name}</span>
                                <span class="stat-right">
                                    <span class="stat-value${highClass}">${n}</span>
                                    <span class="stat-bar-track"><span class="stat-bar-fill" style="width:${pct}%"></span></span>
                                </span>
                            </div>`;
                        }
                    } catch(e) {}
                });
                html += '</div>';
            });

            html += '</div>'; // close stat-category
        });

        statsPanel.innerHTML = html;

        // Feed game variables to music modulation engine
        if (window.applyGameModulation) window.applyGameModulation(vars);
    }

    // ===== EVENT HANDLERS =====
    let statsOpen = false;
    $('stats-btn').addEventListener('click', () => {
        statsOpen = !statsOpen;
        if (statsOpen) { updateStats(); statsPanel.classList.add('open'); }
        else statsPanel.classList.remove('open');
    });

    let logOpen = false;
    $('log-btn').addEventListener('click', () => {
        logOpen = !logOpen;
        if (logOpen) {
            historyPanel.classList.add('open');
            $('history-close').style.display = 'block';
            historyPanel.scrollTop = historyPanel.scrollHeight;
        } else {
            historyPanel.classList.remove('open');
            $('history-close').style.display = 'none';
        }
    });

    $('history-close').addEventListener('click', () => {
        logOpen = false;
        historyPanel.classList.remove('open');
        $('history-close').style.display = 'none';
    });

    // ===== LOAD =====
    async function loadStory() {
        try {
            const resp = await fetch('inkle/story.json');
            if (!resp.ok) throw new Error('Could not load story.json: ' + resp.status);
            const json = await resp.json();
            if (typeof inkjs === 'undefined') throw new Error('inkjs not loaded');
            story = new inkjs.Story(json);
            $('loading-screen').classList.add('hidden');
            setTimeout(() => $('loading-screen').style.display = 'none', 1000);
            renderStory();
        } catch (err) {
            $('loading-screen').textContent = 'Error: ' + err.message;
            console.error(err);
        }
    }

    loadStory();
</script>
</body>
</html>
