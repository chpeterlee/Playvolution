<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playvolution</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --bg-panel: rgba(10,10,10,0.92);
            --text: #d4d4c8;
            --text-dim: #8a8a7a;
            --text-faint: #5a5a50;
            --accent: #c8a060;
            --cosmic: #b8a8c8;
            --quantum: #a8b8c8;
            --entropiric: #c8a8a0;
            --border: rgba(200,160,96,0.15);
            --border-bright: rgba(200,160,96,0.35);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 18px;
            line-height: 1.7;
            height: 100vh;
            overflow: hidden;
        }

        /* ===== FULLSCREEN LAYERS ===== */
        #scene {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: background 2s ease;
        }

        .scene-room { background: linear-gradient(180deg, #0d0d14 0%, #0a0a0a 40%, #121210 100%); }
        .scene-chat { background: linear-gradient(180deg, #0a0d14 0%, #0a0a0a 40%, #0d1210 100%); }
        .scene-history { background: linear-gradient(180deg, #1a1410 0%, #0a0a0a 40%, #14100d 100%); }
        .scene-cosmic { background: linear-gradient(180deg, #140d1a 0%, #0a0a0a 40%, #0d1014 100%); }
        .scene-quantum { background: linear-gradient(180deg, #0d141a 0%, #0a0a0a 40%, #101014 100%); }
        .scene-crisis { background: linear-gradient(180deg, #1a0d0d 0%, #0a0a0a 40%, #141010 100%); }
        .scene-ending { background: linear-gradient(180deg, #0d1a14 0%, #0a0a0a 50%, #14100d 100%); }

        #vignette {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
        }

        /* p5.js generative background canvas */
        #p5-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
        }

        #p5-canvas canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== MAIN LAYOUT ===== */
        #app {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top bar */
        #top-bar {
            display: flex;
            justify-content: space-between;
            padding: 16px 24px 0;
            flex-shrink: 0;
        }

        .top-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .top-btn:hover {
            border-color: var(--border-bright);
            color: var(--text);
        }

        .top-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Volume slider */
        #volume-slider {
            position: fixed;
            top: 48px;
            right: 24px;
            z-index: 15;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 8px 14px;
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #volume-slider.visible {
            opacity: 1;
            pointer-events: auto;
        }

        #volume-range {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 3px;
            background: rgba(200,160,96,0.2);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #volume-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }

        #volume-range::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            cursor: pointer;
        }

        /* ===== STORY SCROLL AREA ===== */
        #story-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 24px 20px;
            scroll-behavior: smooth;
        }

        #story-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        /* Title */
        #game-title {
            text-align: center;
            padding: 40px 0 30px;
        }

        #game-title h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 16px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        #game-title .subtitle {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        #game-title .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 20px auto;
            opacity: 0.5;
        }

        /* Story sections */
        .story-section {
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(8px);
            animation: sectionIn 0.6s ease forwards;
        }

        @keyframes sectionIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .story-section p {
            margin-bottom: 12px;
        }

        /* Speaker-tagged paragraphs */
        .story-section .narrator-text {
            color: var(--text);
        }

        .story-section .agent-text {
            color: #b0b0a8;
            font-style: italic;
            padding-left: 16px;
            border-left: 2px solid rgba(184,168,200,0.2);
        }

        .story-section .player-text {
            color: var(--text);
        }

        /* ASCII art */
        .ascii-art {
            font-family: 'IBM Plex Mono', 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.15;
            color: var(--text-dim);
            white-space: pre;
            overflow-x: auto;
            margin: 20px 0;
            padding: 16px 0;
            opacity: 0;
            animation: asciiIn 1s ease 0.2s forwards;
            text-align: center;
        }

        .ascii-art.cosmic { color: var(--cosmic); }
        .ascii-art.quantum { color: var(--quantum); }
        .ascii-art.entropiric { color: var(--entropiric); }
        .ascii-art.ember { color: var(--accent); }
        .ascii-art.dim { color: var(--text-faint); }

        @keyframes asciiIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 0.7; transform: scale(1); }
        }

        @media (max-width: 768px) {
            .ascii-art { font-size: 6px; line-height: 1.1; }
        }

        /* Section headers */
        .section-header {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent);
            margin: 30px 0 15px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .section-header::before {
            content: '';
            display: inline-block;
            width: 6px; height: 6px;
            border: 1px solid var(--accent);
            transform: rotate(45deg);
            margin-right: 8px;
            vertical-align: middle;
        }

        /* Stats inline display */
        .stats-block {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--text-faint);
            background: rgba(17,17,17,0.6);
            border-left: 2px solid var(--accent);
            padding: 12px 16px;
            margin: 16px 0;
            line-height: 1.8;
            backdrop-filter: blur(8px);
        }

        /* Scroll indicator */
        #scroll-hint {
            text-align: center;
            padding: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-faint);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #scroll-hint.visible {
            opacity: 0.5;
        }

        /* Scroll-down arrow */
        #scroll-down-hint {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
            font-size: 12px;
            color: var(--text-faint);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, bottom 0.3s ease;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 3px 14px 5px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
        }

        #scroll-down-hint.visible {
            opacity: 0.7;
            animation: hintBounce 2s ease-in-out infinite;
        }

        @keyframes hintBounce {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(4px); }
        }

        /* ===== CHOICES - PINNED BOTTOM ===== */
        #choices-area {
            flex-shrink: 0;
            border-top: 1px solid var(--border);
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-height: 40vh;
            overflow-y: auto;
            padding: 16px 24px;
            display: none;
        }

        #choices-area.open {
            display: block;
        }

        #choices-inner {
            max-width: 680px;
            margin: 0 auto;
        }

        .choice-card {
            background: rgba(20,20,16,0.4);
            border: 1px solid var(--border);
            padding: 14px 20px;
            margin-bottom: 6px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
            opacity: 0;
            transform: translateY(8px);
            animation: cardIn 0.4s ease forwards;
        }

        .choice-card:nth-child(1) { animation-delay: 0.05s; }
        .choice-card:nth-child(2) { animation-delay: 0.1s; }
        .choice-card:nth-child(3) { animation-delay: 0.15s; }
        .choice-card:nth-child(4) { animation-delay: 0.2s; }
        .choice-card:nth-child(5) { animation-delay: 0.25s; }
        .choice-card:nth-child(6) { animation-delay: 0.3s; }
        .choice-card:nth-child(7) { animation-delay: 0.35s; }
        .choice-card:nth-child(8) { animation-delay: 0.4s; }
        .choice-card:nth-child(9) { animation-delay: 0.45s; }
        .choice-card:nth-child(10) { animation-delay: 0.5s; }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .choice-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 3px; height: 100%;
            background: var(--accent);
            transform: scaleY(0);
            transition: transform 0.3s ease;
            transform-origin: bottom;
        }

        .choice-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(200,160,96,0.04), transparent);
            transition: left 0.5s ease;
        }

        .choice-card:hover {
            border-color: var(--border-bright);
            background: rgba(30,30,24,0.6);
            padding-left: 26px;
        }

        .choice-card:hover::before { transform: scaleY(1); }
        .choice-card:hover::after { left: 100%; }

        .choice-card .choice-text {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 17px;
            line-height: 1.5;
            color: var(--text-dim);
            transition: color 0.3s ease;
        }

        .choice-card:hover .choice-text { color: var(--text); }

        .choice-card .choice-index {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            opacity: 0;
            margin-left: 8px;
            transition: opacity 0.3s ease;
        }

        .choice-card:hover .choice-index { opacity: 1; }

        /* ===== STATS PANEL ===== */
        #stats-panel {
            position: fixed;
            top: 50px;
            right: 20px;
            z-index: 20;
            width: 340px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 24px;
            display: none;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(200,160,96,0.15) transparent;
        }

        #stats-panel::-webkit-scrollbar { width: 4px; }
        #stats-panel::-webkit-scrollbar-thumb { background: rgba(200,160,96,0.15); border-radius: 2px; }

        #stats-panel.open { display: block; }

        #stats-panel h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .stat-group {
            margin-bottom: 16px;
            padding: 10px 12px;
            border-radius: 6px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
        }

        .stat-group.g-capabilities { border-left: 3px solid #8b9e6b; }
        .stat-group.g-resources   { border-left: 3px solid #6b8e9e; }
        .stat-group.g-cosmic      { border-left: 3px solid #9e6b8e; }
        .stat-group.g-quantum     { border-left: 3px solid #6b7e9e; }
        .stat-group.g-meshwork    { border-left: 3px solid #9e8e6b; }
        .stat-group.g-agent       { border-left: 3px solid #7b9e6b; }
        .stat-group.g-factions    { border-left: 3px solid #8b6b6b; }

        .stat-group-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 8px;
        }

        .stat-group.g-capabilities .stat-group-label { color: #8b9e6b; }
        .stat-group.g-resources .stat-group-label    { color: #6b8e9e; }
        .stat-group.g-cosmic .stat-group-label       { color: #9e6b8e; }
        .stat-group.g-quantum .stat-group-label      { color: #6b7e9e; }
        .stat-group.g-meshwork .stat-group-label     { color: #9e8e6b; }
        .stat-group.g-agent .stat-group-label        { color: #7b9e6b; }
        .stat-group.g-factions .stat-group-label     { color: #8b6b6b; }

        .stat-row {
            display: flex;
            align-items: center;
            padding: 4px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            line-height: 1.5;
        }

        .stat-row .stat-name {
            color: var(--text-dim);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
            font-size: 11px;
        }

        .stat-row .stat-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .stat-row .stat-value {
            color: var(--text);
            font-weight: 500;
            min-width: 24px;
            text-align: right;
            font-size: 12px;
        }

        .stat-bar-track {
            width: 80px;
            height: 4px;
            background: rgba(200,160,96,0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .stat-group.g-capabilities .stat-bar-fill { background: #8b9e6b; }
        .stat-group.g-resources .stat-bar-fill    { background: #6b8e9e; }
        .stat-group.g-cosmic .stat-bar-fill       { background: #9e6b8e; }
        .stat-group.g-quantum .stat-bar-fill      { background: #6b7e9e; }
        .stat-group.g-meshwork .stat-bar-fill     { background: #9e8e6b; }
        .stat-group.g-agent .stat-bar-fill        { background: #7b9e6b; }
        .stat-group.g-factions .stat-bar-fill     { background: #8b6b6b; }

        /* High-value stat highlight */
        .stat-value.stat-high {
            color: var(--accent);
            font-weight: 600;
        }

        /* Stat divider between groups */
        .stat-chapter-marker {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            color: var(--text-faint);
            text-align: center;
            padding: 6px 0;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        /* ===== HISTORY PANEL ===== */
        #history-panel {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            background: rgba(10,10,10,0.97);
            display: none;
            overflow-y: auto;
            padding: 60px 40px 100px;
        }

        #history-panel.open { display: block; }

        #history-panel .log-entry {
            max-width: 700px;
            margin: 0 auto 16px;
            padding: 14px 18px;
            border-left: 2px solid var(--border);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text-dim);
        }

        #history-panel .log-entry .speaker-tag {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 4px;
        }

        #history-panel .log-entry.agent-entry {
            border-left-color: var(--cosmic);
            background: rgba(184,168,200,0.03);
        }

        #history-panel .log-entry.agent-entry .speaker-tag { color: var(--cosmic); }

        #history-close {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 51;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            color: var(--text-faint);
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            padding: 6px 14px;
            cursor: pointer;
        }

        /* ===== ENDING OVERLAY ===== */
        #ending-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5,5,5,0.95);
            padding: 40px;
            text-align: center;
        }

        #ending-overlay.open { display: flex; }

        #ending-overlay .ending-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 2s ease forwards;
        }

        #ending-overlay .ending-body {
            max-width: 600px;
            font-size: 18px;
            line-height: 1.8;
            color: var(--text-dim);
            opacity: 0;
            animation: fadeUp 2s ease 0.5s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== LOADING ===== */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 200;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--text-faint);
            transition: opacity 0.8s ease;
        }

        #loading-screen.hidden { opacity: 0; pointer-events: none; }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            body { font-size: 16px; }
            #story-area { padding: 20px 16px 10px; }
            #game-title h1 { font-size: 32px; letter-spacing: 10px; }
            #choices-area { padding: 12px 16px; }
            .choice-card { padding: 12px 16px; }
            #stats-panel { width: calc(100% - 32px); right: 16px; padding: 16px; }
            .stat-bar-track { width: 60px; }
            #top-bar { padding: 12px 16px 0; }
            #volume-slider { right: 16px; top: 44px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.2s !important;
            }
            #p5-canvas { display: none; }
            #volume-slider { display: none; }
        }
    </style>
</head>
<body>

<!-- Background layers -->
<div id="scene" class="scene-room"></div>
<div id="vignette"></div>
<div id="p5-canvas"></div>

<!-- Loading -->
<div id="loading-screen">Loading...</div>

<!-- Main app -->
<div id="app">
    <!-- Top bar -->
    <div id="top-bar">
        <button class="top-btn" id="log-btn">LOG</button>
        <button class="top-btn" id="stats-btn">STATS</button>
        <button class="top-btn" id="audio-btn">MUSIC</button>
        <div id="volume-slider">
            <input type="range" id="volume-range" min="0" max="1" step="0.05" value="0.7">
        </div>
    </div>

    <!-- Scrollable story text -->
    <div id="story-area">
        <div id="story-inner">
            <div id="game-title">
                <h1>PLAYVOLUTION</h1>
                <div class="divider"></div>
                <div class="subtitle">surplus &middot; signal &middot; the thing that plays back</div>
            </div>
            <div id="story-content"></div>
        </div>
    </div>

    <!-- Scroll-down hint -->
    <div id="scroll-down-hint">&#x25BC;</div>

    <!-- Pinned bottom choices -->
    <div id="choices-area">
        <div id="choices-inner"></div>
    </div>
</div>

<!-- Overlays -->
<div id="stats-panel"></div>
<div id="history-panel"></div>
<button id="history-close" style="display:none">CLOSE</button>
<div id="ending-overlay">
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-body" id="ending-body"></div>
</div>

<script src="https://unpkg.com/inkjs@2.4.0/dist/ink.js"></script>
<script src="https://unpkg.com/@strudel/web@1.3.0"></script>

<script>
// ===== STRUDEL DYNAMIC MUSIC ENGINE =====
let strudelReady = false;
let audioPlaying = false;
let masterVolume = 0.7;
let currentMusicScene = 'room';
let currentModulation = null;
let lastModulation = { entropy: 0, signal: 0, tempo: 0 };
let currentChapter = 1;
let activePatterns = [];

// --- Compute modulation parameters from ink game variables ---
function computeModulation(vars) {
    const entropy = vars.entropiric_saturation || 40;
    const signal = vars.neganthropomorphic_signal || 10;
    const tempo = vars.operational_tempo || 10;
    const fear = vars.public_fear || 30;
    const fidelity = vars.augmentation_fidelity || 50;
    const awareness = vars.cosmic_awareness || 0;
    const chapter = vars.chapter || 1;

    // Filter sweep range: wider with higher fidelity/awareness, compressed by entropy
    const cutoffLow = Math.max(100, 200 - (entropy - 40) * 3);
    const cutoffHigh = Math.max(cutoffLow + 200, Math.min(6000,
        1200 + (fidelity - 50) * 15 + awareness * 20));

    // Gain: slightly louder with more fear
    const gainBase = 0.06 + (fear - 30) * 0.0003;
    const gain = Math.max(0.03, Math.min(0.12, gainBase));

    // Reverb: deeper with more signal/awareness
    const roomBase = 0.3 + (signal - 10) * 0.004 + awareness * 0.008;
    const room = Math.max(0.1, Math.min(0.85, roomBase));

    // Harmonic rhythm speed
    const speedDiv = Math.max(1, 5 - Math.floor(tempo / 10));

    // Chapter progression: layering density and brightness
    const chapterLayer = Math.min(4, Math.floor((chapter - 1) / 2));
    const chapterBrightness = Math.min(1, (chapter - 1) * 0.12);

    // Delay mix increases with cosmic awareness
    const delayAmt = Math.max(0.1, Math.min(0.6, 0.2 + awareness * 0.03));

    // Rhythmic density from operational tempo
    const rhythmicDensity = Math.max(3, Math.min(8, Math.floor(tempo / 5)));

    return {
        cutoffLow, cutoffHigh, gain, room, speedDiv,
        entropy, signal, tempo, fear, chapter, chapterLayer, chapterBrightness,
        delayAmt, rhythmicDensity, awareness
    };
}

// --- Helper: clamp a room value to safe bounds ---
function clampRoom(v) { return Math.max(0.05, Math.min(0.95, v)); }

// --- Build pattern objects for a scene (direct Strudel API, no string eval) ---
function buildPatterns(sceneName, mod) {
    if (!mod) mod = {
        cutoffLow: 200, cutoffHigh: 1200, gain: 0.06, room: 0.4,
        speedDiv: 2, chapterLayer: 0, chapterBrightness: 0,
        delayAmt: 0.2, rhythmicDensity: 4, awareness: 0
    };

    const vol = masterVolume;
    const gn = mod.gain * vol;
    const cutLo = mod.cutoffLow;
    const cutHi = mod.cutoffHigh;
    const rm = mod.room;
    const spd = mod.speedDiv;
    const layer = mod.chapterLayer;
    const dly = mod.delayAmt;

    const pats = [];

    const scenes = {

        // ── ROOM: Introspective, evolving ambient ──────────────────────
        room: () => {
            // Bass drone: deep sawtooth with slow sine filter sweep
            pats.push(
                note('c2').s('sawtooth')
                    .cutoff(sine.range(cutLo, cutHi * 0.4).slow(8))
                    .gain(gn * 0.7).attack(0.6).release(1.8)
                    .room(clampRoom(rm)).roomsize(9).orbit(1)
            );
            // Harmonic pad: slow Cm→Eb→Ab→Gm chord cycle, triangle warmth
            pats.push(
                note('<[c3,eb3,g3] [eb3,g3,bb3] [ab2,c3,eb3] [g2,bb2,d3]>').s('triangle')
                    .cutoff(sine.range(cutLo * 1.5, cutHi * 0.6).slow(6))
                    .gain(gn * 0.5).attack(0.8).release(1.2)
                    .slow(spd).room(clampRoom(rm + 0.1)).orbit(1)
            );
            // Atmosphere: perlin-modulated high shimmer
            pats.push(
                note('<c5 eb5 g5>').s('sine')
                    .gain(perlin.range(0, gn * 0.2).slow(4))
                    .attack(1.0).release(2.0)
                    .slow(spd + 3).room(clampRoom(rm + 0.3)).orbit(3)
            );
            // Ch2+: Rhythmic Euclidean pulse with octave jux
            if (layer >= 1) {
                pats.push(
                    note('c3').euclid(3, 8).s('triangle')
                        .cutoff(cutHi * 0.6).gain(gn * 0.35)
                        .attack(0.04).release(0.15)
                        .delay(dly).delaytime(0.25).delayfeedback(0.3).orbit(2)
                        .jux(x => x.add(7))
                );
            }
            // Ch3+: Melodic fragments with probabilistic transposition
            if (layer >= 2) {
                pats.push(
                    note('<c4 eb4 g4 bb3>').s('sine').euclid(5, 12)
                        .gain(gn * 0.25).attack(0.1).release(0.35)
                        .room(clampRoom(rm + 0.2)).orbit(3)
                        .sometimes(x => x.add(7))
                        .rarely(x => x.fast(2))
                        .jux(rev)
                );
            }
            // Ch4+: Textural rhythm with degradation
            if (layer >= 3) {
                pats.push(
                    note('<eb4 g4 bb4>').s('triangle')
                        .euclid(7, 16).gain(gn * 0.15)
                        .attack(0.02).release(0.1)
                        .cutoff(sine.range(800, cutHi).slow(3))
                        .delay(dly * 0.5).delaytime(1 / 6).delayfeedback(0.5)
                        .orbit(4).degradeBy(0.3)
                );
            }
            // Ch5+: Sub-bass undertone with slow pulse
            if (layer >= 4) {
                pats.push(
                    note('<c1 g1>').s('sine')
                        .gain(gn * 0.2).attack(1.5).release(3.0)
                        .slow(8).room(clampRoom(rm + 0.15)).roomsize(12).orbit(5)
                        .sometimes(x => x.cutoff(sine.range(60, 200).slow(4)))
                );
            }
        },

        // ── CHAT: Analytical, conversational counterpoint ──────────────
        chat: () => {
            // Moving bassline: A→E→A→D with stereo reverse
            pats.push(
                note('<a2 e3 a2 d3>').s('triangle')
                    .cutoff(sine.range(cutLo, cutHi * 0.5).slow(4))
                    .gain(gn * 0.6).attack(0.15).release(0.4)
                    .slow(spd).room(clampRoom(rm * 0.8)).orbit(1)
                    .jux(rev)
            );
            // Pad: Am→G→F→E chord cycle with subtle stereo widening
            pats.push(
                note('<[a3,c4,e4] [g3,b3,d4] [f3,a3,c4] [e3,g3,b3]>').s('triangle')
                    .cutoff(sine.range(cutLo * 2, cutHi * 0.7).slow(5))
                    .gain(gn * 0.4).attack(0.3).release(0.6)
                    .slow(spd).room(clampRoom(rm)).orbit(1)
                    .jux(x => x.rev().late(0.05))
            );
            // Ch2+: Faster Euclidean rhythmic pulse with interval variation
            if (layer >= 1) {
                pats.push(
                    note('<a3 c4>').s('triangle').euclid(5, 8)
                        .cutoff(cutHi * 0.5).gain(gn * 0.3)
                        .attack(0.03).release(0.12)
                        .delay(dly).delaytime(1 / 8).delayfeedback(0.35).orbit(2)
                        .sometimes(x => x.add(5))
                );
            }
            // Ch3+: Counter-melody with perlin filter evolution
            if (layer >= 2) {
                pats.push(
                    note('<e4 a4 c5 b4>').s('sine')
                        .cutoff(perlin.range(cutLo * 3, cutHi).slow(3))
                        .gain(gn * 0.2).attack(0.1).release(0.3)
                        .euclid(3, 8).room(clampRoom(rm + 0.15)).orbit(3)
                        .rarely(x => x.add(12))
                );
            }
            // Ch4+: Glitch texture — sparse, degraded
            if (layer >= 3) {
                pats.push(
                    note('<a5 c6>').s('sine')
                        .gain(gn * 0.08).attack(0.01).release(0.05)
                        .euclid(mod.rhythmicDensity, 16).orbit(4)
                        .degradeBy(0.5)
                        .delay(0.4).delaytime(1 / 12).delayfeedback(0.6)
                );
            }
            // Ch5+: Subtle sub-harmonic movement
            if (layer >= 4) {
                pats.push(
                    note('<a1 e1>').s('sawtooth')
                        .cutoff(sine.range(50, 150).slow(10))
                        .gain(gn * 0.15).attack(1.0).release(2.0)
                        .slow(6).room(clampRoom(rm + 0.1)).roomsize(8).orbit(5)
                );
            }
        },

        // ── HISTORY: Orchestral weight, narrative gravitas ─────────────
        history: () => {
            // Deep bass drone: D sawtooth, dark and heavy
            pats.push(
                note('d2').s('sawtooth')
                    .cutoff(sine.range(cutLo * 0.5, cutHi * 0.3).slow(10))
                    .gain(gn * 0.8).attack(0.7).release(2.0)
                    .room(clampRoom(rm + 0.1)).roomsize(10).orbit(1)
            );
            // Harmonic progression: Dm→Bb→Gm→A with time-offset stereo
            pats.push(
                note('<[d3,f3,a3] [bb2,d3,f3] [g2,bb2,d3] [a2,cs3,e3]>').s('sawtooth')
                    .cutoff(sine.range(cutLo * 2, cutHi * 0.5).slow(8))
                    .gain(gn * 0.45).attack(0.6).release(1.0)
                    .slow(Math.max(2, spd)).room(clampRoom(rm + 0.15)).orbit(1)
                    .jux(x => x.rev().late(0.05))
            );
            // Atmosphere: high harmonics with perlin gain (breathing)
            pats.push(
                note('<d5 f5 a5>').s('sine')
                    .gain(perlin.range(0, gn * 0.15).slow(6))
                    .attack(0.8).release(1.5)
                    .slow(Math.max(3, spd + 2)).room(clampRoom(rm + 0.25)).orbit(3)
            );
            // Ch2+: Ostinato rhythm with occasional reversal
            if (layer >= 1) {
                pats.push(
                    note('<d3 a3 d4 a3>').s('triangle').euclid(5, 12)
                        .cutoff(sine.range(cutLo * 3, cutHi * 0.7).slow(4))
                        .gain(gn * 0.3).attack(0.05).release(0.2)
                        .delay(dly).delaytime(3 / 16).delayfeedback(0.4).orbit(2)
                        .sometimes(x => x.rev())
                );
            }
            // Ch3+: Haunting melody with sparse high notes
            if (layer >= 2) {
                pats.push(
                    note('<a4 d5 f5 e5 d5 c5>').s('sine').euclid(7, 16)
                        .gain(gn * 0.2).attack(0.15).release(0.4)
                        .room(clampRoom(rm + 0.2)).orbit(3)
                        .sometimes(x => x.add(7))
                        .rarely(x => x.add(-12))
                );
            }
            // Ch4+: String-like sustained layer with superimposed fifth
            if (layer >= 3) {
                pats.push(
                    note('<d4 f4 a4 d5>').s('sawtooth')
                        .cutoff(cutHi * 0.4).gain(gn * 0.12)
                        .attack(0.4).release(0.8)
                        .slow(Math.max(3, spd)).room(clampRoom(rm + 0.2)).orbit(4)
                        .superimpose(x => x.add(7))
                );
            }
            // Ch5+: Sub-bass pulse
            if (layer >= 4) {
                pats.push(
                    note('<d1 a1>').s('sine').euclid(2, 8)
                        .gain(gn * 0.2).attack(0.8).release(1.5)
                        .slow(2).room(clampRoom(rm + 0.1)).roomsize(12).orbit(5)
                );
            }
        },

        // ── COSMIC: Ethereal, expansive, wide stereo ──────────────────
        cosmic: () => {
            // Deep bass: E2 sine, very slow
            pats.push(
                note('e2').s('sine')
                    .gain(gn * 0.6).attack(0.8).release(2.0)
                    .slow(4).room(clampRoom(rm + 0.2)).roomsize(12).orbit(1)
            );
            // Ethereal pad: Em7→Dm7→Cmaj7→Bm7 with wide stereo offset
            pats.push(
                note('<[e3,g3,b3,d4] [d3,fs3,a3,c4] [c3,e3,g3,b3] [b2,d3,fs3,a3]>').s('sine')
                    .cutoff(sine.range(cutLo * 2, cutHi * 0.8).slow(8))
                    .gain(gn * 0.4).attack(1.0).release(1.5)
                    .slow(Math.max(3, spd + 1)).room(clampRoom(rm + 0.2)).orbit(1)
                    .jux(x => x.rev().late(0.1))
            );
            // Harmonic texture: perlin gain + sine filter modulation
            pats.push(
                note('<e5 g5 b5 e6>').s('sine')
                    .gain(perlin.range(0, gn * 0.12).slow(5))
                    .cutoff(sine.range(1000, cutHi * 1.5).slow(6))
                    .attack(1.2).release(2.5)
                    .slow(Math.max(4, spd + 2)).room(clampRoom(rm + 0.3)).orbit(3)
                    .sometimes(x => x.add(12))
            );
            // Ch2+: Slow heartbeat Euclidean pulse with fifth jux
            if (layer >= 1) {
                pats.push(
                    note('e3').euclid(2, 8).s('sine')
                        .cutoff(cutHi * 0.3).gain(gn * 0.3)
                        .attack(0.2).release(0.5)
                        .slow(2).room(clampRoom(rm + 0.1)).orbit(2)
                        .jux(x => x.add(7))
                );
            }
            // Ch3+: Twinkling stars — sparse, degraded, delayed
            if (layer >= 2) {
                pats.push(
                    note('<b5 e6 g6>').s('sine')
                        .euclid(3, 16).gain(gn * 0.1)
                        .attack(0.05).release(0.3)
                        .delay(0.5).delaytime(3 / 8).delayfeedback(0.6).orbit(3)
                        .degradeBy(0.4)
                        .often(x => x.add(5))
                );
            }
            // Ch4+: Void drone — ultra-deep, ultra-reverb
            if (layer >= 3) {
                pats.push(
                    note('<e1 b1>').s('sine')
                        .gain(gn * 0.15).attack(2.0).release(4.0)
                        .slow(8).room(0.95).roomsize(15).orbit(4)
                );
            }
            // Ch5+: Cosmic shimmer with slow panning
            if (layer >= 4) {
                pats.push(
                    note('<fs6 a6 b6>').s('sine')
                        .gain(gn * 0.04).attack(0.5).release(1.5)
                        .slow(6).room(0.9).orbit(5)
                        .pan(sine.slow(3))
                        .degradeBy(0.3)
                );
            }
        },

        // ── QUANTUM: Energetic, polyrhythmic, glitchy ─────────────────
        quantum: () => {
            // Driving bass pattern with jux fast
            pats.push(
                note('<f2 f2 f3 eb2>').s('sawtooth')
                    .cutoff(sine.range(cutLo, cutHi * 0.6).slow(3))
                    .gain(gn * 0.55).attack(0.05).release(0.25)
                    .slow(spd).room(clampRoom(rm * 0.6)).orbit(1)
                    .jux(x => x.fast(1.5))
            );
            // Polyrhythmic lead: F minor with probabilistic variation
            pats.push(
                note('<f4 ab4 c5 eb5>').s('triangle')
                    .cutoff(perlin.range(cutLo * 3, cutHi).slow(4))
                    .gain(gn * 0.35).attack(0.08).release(0.3)
                    .euclid(5, 8).room(clampRoom(rm)).orbit(1)
                    .sometimes(x => x.add(7))
                    .sometimes(x => x.rev())
            );
            // Second polyrhythmic voice: (3,8) against (5,8)
            pats.push(
                note('<c5 f5 ab5>').s('sine')
                    .cutoff(sine.range(cutHi * 0.5, cutHi).slow(2))
                    .gain(gn * 0.2).attack(0.04).release(0.15)
                    .euclid(3, 8).room(clampRoom(rm + 0.1)).orbit(2)
                    .rarely(x => x.fast(2))
            );
            // Ch2+: Fast degraded glitch texture
            if (layer >= 1) {
                pats.push(
                    note('<f3 ab3 c4 eb4>').s('triangle')
                        .euclid(7, 16).gain(gn * 0.15)
                        .attack(0.02).release(0.08)
                        .cutoff(cutHi * 0.8).orbit(2)
                        .degradeBy(0.3)
                        .delay(dly).delaytime(1 / 8).delayfeedback(0.5)
                );
            }
            // Ch3+: Sustained harmony with phaser
            if (layer >= 2) {
                pats.push(
                    note('<[f3,ab3,c4] [eb3,g3,bb3]>').s('sawtooth')
                        .cutoff(sine.range(cutLo * 4, cutHi * 0.8).slow(6))
                        .gain(gn * 0.15).attack(0.3).release(0.6)
                        .slow(spd + 1).room(clampRoom(rm + 0.15)).orbit(3)
                        .phaser(2).phaserdepth(0.6)
                        .jux(rev)
                );
            }
            // Ch4+: Chaotic perlin texture
            if (layer >= 3) {
                pats.push(
                    note('<f5 ab5 c6>').s('sine')
                        .gain(perlin.range(0, gn * 0.1).slow(2))
                        .euclid(mod.rhythmicDensity, 16)
                        .attack(0.01).release(0.06)
                        .delay(0.6).delaytime(1 / 6).delayfeedback(0.7).orbit(4)
                        .degradeBy(0.4)
                );
            }
            // Ch5+: Rapid arpeggiation
            if (layer >= 4) {
                pats.push(
                    note('<f4 ab4 c5 f5 ab5 c6>').s('sine')
                        .gain(gn * 0.08).attack(0.01).release(0.04)
                        .fast(4).cutoff(sine.range(1000, cutHi).slow(2))
                        .room(clampRoom(rm + 0.1)).orbit(5)
                        .degradeBy(0.5)
                );
            }
        },

        // ── CRISIS: Urgent, compressed, dissonant ─────────────────────
        crisis: () => {
            // Aggressive bass with low cutoff and high gain
            pats.push(
                note('<c2 c2 ab2 b1>').s('sawtooth')
                    .cutoff(sine.range(cutLo * 0.3, cutHi * 0.2).slow(2))
                    .gain(gn * 1.2).attack(0.03).release(0.2)
                    .room(clampRoom(rm * 0.4)).orbit(1)
            );
            // Dissonant tension chord: Cm(add b) ↔ Cmaj7(b5)
            pats.push(
                note('<[c3,eb3,ab3,b3] [c3,e3,g3,bb3]>').s('sawtooth')
                    .cutoff(sine.range(cutLo, cutHi * 0.4).slow(3))
                    .gain(gn * 0.5).attack(0.05).release(0.3)
                    .slow(Math.min(2, spd)).room(clampRoom(rm * 0.5)).orbit(1)
                    .jux(x => x.rev().fast(1.5))
            );
            // Fast Euclidean pulse: (7,8) for maximum tension
            pats.push(
                note('c3').euclid(7, 8).s('sawtooth')
                    .cutoff(cutHi * 0.3).gain(gn * 0.4)
                    .attack(0.02).release(0.1).orbit(2)
            );
            // Ch2+: Degraded noise-like texture
            if (layer >= 1) {
                pats.push(
                    note('<c4 eb4 g4>').s('sawtooth')
                        .euclid(9, 16).gain(gn * 0.2)
                        .attack(0.01).release(0.06)
                        .cutoff(sine.range(cutHi * 0.2, cutHi * 0.5).slow(2))
                        .degradeBy(0.4).orbit(2)
                        .delay(0.2).delaytime(0.06).delayfeedback(0.5)
                );
            }
            // Ch3+: Alarm-like sparse high notes
            if (layer >= 2) {
                pats.push(
                    note('<c5 eb5>').s('sawtooth')
                        .euclid(3, 16).gain(gn * 0.15)
                        .attack(0.01).release(0.08)
                        .cutoff(cutHi * 0.6).orbit(3)
                        .sometimes(x => x.add(12))
                );
            }
            // Ch4+: Inharmonic drone with distortion
            if (layer >= 3) {
                pats.push(
                    note('<c2 ab1>').s('sawtooth')
                        .cutoff(cutLo * 0.5).gain(gn * 0.3)
                        .attack(0.3).release(0.5)
                        .slow(2).room(clampRoom(rm * 0.3)).orbit(4)
                        .distort(3).postgain(0.3)
                );
            }
            // Ch5+: Rapid stutter pattern
            if (layer >= 4) {
                pats.push(
                    note('<c4 eb4 g4 c5>').s('sawtooth')
                        .euclid(11, 16).gain(gn * 0.12)
                        .attack(0.01).release(0.03)
                        .cutoff(cutHi * 0.4).orbit(5)
                        .degradeBy(0.6)
                        .delay(0.3).delaytime(0.04).delayfeedback(0.6)
                );
            }
        },

        // ── ENDING: Resolved, warm, peaceful ──────────────────────────
        ending: () => {
            // Warm resolved bass: C→F
            pats.push(
                note('<c2 f2>').s('sine')
                    .gain(gn * 0.6).attack(0.8).release(2.0)
                    .slow(4).room(clampRoom(rm + 0.2)).roomsize(10).orbit(1)
            );
            // Resolution chords: C→F with superimposed octave
            pats.push(
                note('<[c4,e4,g4] [f4,a4,c5]>').s('sine')
                    .gain(gn * 0.5).attack(0.6).release(1.5)
                    .slow(5).room(clampRoom(rm + 0.25)).orbit(1)
                    .superimpose(x => x.add(12).gain(gn * 0.15))
            );
            // High shimmer: maximum reverb, very slow
            pats.push(
                note('<c6 e6 g6>').s('sine')
                    .gain(gn * 0.08).attack(1.5).release(3.0)
                    .slow(6).room(0.95).roomsize(15).orbit(3)
            );
        }
    };

    const builder = scenes[sceneName] || scenes.room;
    builder();

    // Append adaptive percussive patterns
    const percPatterns = buildPercussion(sceneName, mod);
    for (const p of percPatterns) {
        pats.push(p);
    }

    return pats;
}

// --- Build adaptive percussive patterns that respond to game state ---
function buildPercussion(sceneName, mod) {
    if (!mod) mod = {
        gain: 0.06, chapterLayer: 0, speedDiv: 2, delayAmt: 0.2,
        entropy: 40, tempo: 10, fear: 30, signal: 10, awareness: 0,
        rhythmicDensity: 4
    };

    const vol = masterVolume;
    const gn = mod.gain * vol;
    const layer = mod.chapterLayer;
    const spd = mod.speedDiv;
    const dly = mod.delayAmt;
    const entropy = mod.entropy || 40;
    const tempo = mod.tempo || 10;
    const fear = mod.fear || 30;
    const signal = mod.signal || 10;

    // Percussion base gain: louder with more fear and chapter progression
    const percBase = gn * (0.4 + layer * 0.12 + Math.max(0, (fear - 30)) * 0.004);

    // Entropy drives random gaps (more entropy = more silence)
    const entDegrade = Math.min(0.6, Math.max(0, (entropy - 35) * 0.012));

    // Hihat density scales with operational tempo
    const hhPulse = Math.max(4, Math.min(10, Math.floor(tempo / 3)));

    // Percussion reverb scales with signal strength
    const percRoom = clampRoom(0.15 + (signal - 10) * 0.008);

    // Use orbits 10+ to keep percussion reverb/delay independent from melodic
    const PO = 10;

    const pats = [];

    const perc = {

        // ── ROOM: Sparse, ghostly, atmospheric ────────────────────────
        room: () => {
            if (layer >= 1) {
                // Soft rim click, very sparse
                pats.push(
                    s('rim').gain(percBase * 0.3)
                        .euclid(2, 16).slow(2)
                        .speed(perlin.range(0.8, 1.2).slow(4))
                        .room(percRoom + 0.15).roomsize(6).orbit(PO)
                        .degradeBy(entDegrade + 0.3)
                );
            }
            if (layer >= 2) {
                // Whispered hihat, heavily degraded
                pats.push(
                    s('hh').gain(percBase * 0.12)
                        .euclid(hhPulse - 2, 16).slow(2)

// --- Initialize Strudel (called on first user click) ---
async function initAudio() {
    if (strudelReady) return true;
    try {
        if (typeof initStrudel === 'function') {
            await initStrudel();
            strudelReady = true;
            console.log('Strudel audio initialized');
            return true;
        }
        console.warn('Strudel not loaded');
        return false;
    } catch (e) {
        console.warn('Strudel init failed:', e.message);
        return false;
    }
}

// --- Start or switch to a scene's pattern ---
async function playSceneMusic(sceneName, mod) {
    if (!strudelReady) {
        const ok = await initAudio();
        if (!ok) return;
    }

    currentMusicScene = sceneName;
    currentModulation = mod || null;

    // Stop all current patterns
    stopMusic();

    // Build and play new patterns directly via Strudel API
    try {
        activePatterns = buildPatterns(sceneName, mod);
        for (const p of activePatterns) {
            p.play();
        }
        audioPlaying = true;
    } catch (e) {
        console.warn('Strudel direct play failed:', e.message);
        // Fallback: try evaluate() with a simple pattern string
        try {
            const fbGn = (0.05 * masterVolume).toFixed(4);
            evaluate(
                'note("<c3 [eb3 g3]>").s("sawtooth")' +
                '.cutoff(800).gain(' + fbGn + ')' +
                '.attack(0.3).release(0.8).slow(2).room(0.4)'
            );
            audioPlaying = true;
        } catch (e2) {
            console.warn('Strudel fallback failed:', e2.message);
        }
    }
}

// --- Stop all music ---
function stopMusic() {
    try { hush(); } catch (e) { /* ignore */ }
    activePatterns = [];
    audioPlaying = false;
}

// --- Sound effects: short Strudel patterns played on top of music ---
function playSfx(type) {
    if (!strudelReady) return;
    try {
        let p;
        switch (type) {
            case 'choice':
                p = note('c5').s('sine').gain(0.06).attack(0.01).release(0.12);
                break;
            case 'transition':
                p = note('<e4 g4>').s('triangle').gain(0.04)
                    .attack(0.02).release(0.25).room(0.3);
                break;
            case 'discovery':
                p = note('<a4 c5 e5>').s('sine').gain(0.05)
                    .attack(0.05).release(0.35).room(0.4)
                    .delay(0.3).delaytime(1 / 8).delayfeedback(0.3);
                break;
            case 'companion':
                p = note('<d4 f4 a4> <c4 e4 g4>').s('triangle').gain(0.04)
                    .attack(0.05).release(0.3).room(0.3)
                    .superimpose(x => x.add(7).gain(0.01));
                break;
            case 'crisis_alert':
                p = note('<c3 eb3>').s('sawtooth').cutoff(400).gain(0.08)
                    .attack(0.01).release(0.15)
                    .delay(0.4).delaytime(0.1).delayfeedback(0.5);
                break;
            case 'ending_resolve':
                p = note('<c4 e4 g4 c5>').s('sine').gain(0.05)
                    .attack(0.1).release(0.7).room(0.5).slow(2)
                    .superimpose(x => x.add(12).gain(0.015));
                break;
            default: return;
        }
        if (p && typeof p.play === 'function') {
            p.play();
        }
    } catch (e) {
        // SFX failure is non-critical
    }
}

// --- Called from updateStats / renderStory to re-evaluate with new modulation ---
function applyGameModulation(vars) {
    if (!audioPlaying || !strudelReady) return;

    const mod = computeModulation(vars);
    const scene = window._currentScene || 'room';

    // Track chapter changes
    if (vars.chapter && vars.chapter !== currentChapter) {
        currentChapter = vars.chapter;
    }

    // Only re-trigger if key variables changed significantly
    const entropyShift = Math.abs(mod.entropy - lastModulation.entropy);
    const signalShift = Math.abs(mod.signal - lastModulation.signal);
    const tempoShift = Math.abs(mod.tempo - lastModulation.tempo);

    if (entropyShift > 10 || signalShift > 8 || tempoShift > 5) {
        lastModulation = { entropy: mod.entropy, signal: mod.signal, tempo: mod.tempo };
        playSceneMusic(scene, mod);
    }
}

// --- Set master volume ---
function setMasterVolume(v) {
    masterVolume = Math.max(0, Math.min(1, v));
    // Re-evaluate current pattern with new volume
    if (audioPlaying && strudelReady) {
        const scene = window._currentScene || 'room';
        playSceneMusic(scene, currentModulation);
    }
}

// --- Audio toggle + volume slider ---
document.addEventListener('DOMContentLoaded', () => {
    const audioBtn = document.getElementById('audio-btn');
    if (!audioBtn) return;

    audioBtn.addEventListener('click', async () => {
        if (!audioPlaying) {
            const ok = await initAudio();
            if (ok) {
                const scene = window._currentScene || 'room';
                playSceneMusic(scene);
                audioBtn.textContent = 'MUSIC \u25CF';
                audioBtn.classList.add('active');
                document.getElementById('volume-slider')?.classList.add('visible');
            }
        } else {
            stopMusic();
            audioBtn.textContent = 'MUSIC';
            audioBtn.classList.remove('active');
            document.getElementById('volume-slider')?.classList.remove('visible');
        }
    });

    // Volume slider
    const volSlider = document.getElementById('volume-range');
    if (volSlider) {
        volSlider.addEventListener('input', (e) => {
            setMasterVolume(parseFloat(e.target.value));
        });
    }
});

// Expose for the game engine
window.playSceneMusic = playSceneMusic;
window.stopMusic = stopMusic;
window.applyGameModulation = applyGameModulation;
window.playSfx = playSfx;
window.setMasterVolume = setMasterVolume;
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>

<script>
// ===== P5.JS GENERATIVE BACKGROUND =====
let p5Scene = 'room';
let p5Transition = 0;
let p5TargetScene = 'room';

const p5Sketch = (p) => {
    let particles = [];
    const maxParticles = 60;

    p.setup = function() {
        const cnv = p.createCanvas(p.windowWidth, p.windowHeight);
        cnv.parent('p5-canvas');
        p.noiseSeed(42);
        p.colorMode(p.HSB, 360, 100, 100, 100);
        p.frameRate(30);

        for (let i = 0; i < maxParticles; i++) {
            particles.push({
                x: p.random(p.width),
                y: p.random(p.height),
                vx: 0, vy: 0,
                size: p.random(1, 2.5),
                life: p.random(0.3, 1)
            });
        }
    };

    p.draw = function() {
        p.background(0, 0, 0, 8); // slow fade
        const t = p.frameCount * 0.005;

        // Scene parameters
        const sceneParams = getSceneParams(p5Scene);
        p5Transition = p.lerp(p5Transition, 1, 0.02);

        switch (sceneParams.style) {
            case 'flow':
                drawFlowField(p, t, sceneParams);
                break;
            case 'network':
                drawNetwork(p, t, sceneParams);
                break;
            case 'rings':
                drawRings(p, t, sceneParams);
                break;
            case 'glitch':
                drawGlitch(p, t, sceneParams);
                break;
            case 'constellation':
                drawConstellation(p, t, sceneParams);
                break;
            default:
                drawFlowField(p, t, sceneParams);
        }
    };

    p.windowResized = function() {
        p.resizeCanvas(p.windowWidth, p.windowHeight);
    };

    // ===== SCENE DRAWING FUNCTIONS =====

    function drawFlowField(p, t, params) {
        const scale = 0.003;
        const h = params.hue;
        p.noStroke();
        for (let i = 0; i < particles.length; i++) {
            const pt = particles[i];
            const angle = p.noise(pt.x * scale, pt.y * scale, t * params.speed) * p.TWO_PI * 2;
            pt.vx = p.lerp(pt.vx, p.cos(angle) * params.force, 0.1);
            pt.vy = p.lerp(pt.vy, p.sin(angle) * params.force, 0.1);
            pt.x += pt.vx;
            pt.y += pt.vy;
            if (pt.x < 0) pt.x = p.width;
            if (pt.x > p.width) pt.x = 0;
            if (pt.y < 0) pt.y = p.height;
            if (pt.y > p.height) pt.y = 0;
            p.fill(h, params.sat, params.bri, pt.life * params.alpha * 60);
            p.circle(pt.x, pt.y, pt.size * params.sizeMul);
        }
    }

    function drawNetwork(p, t, params) {
        const count = 25;
        const pts = [];
        for (let i = 0; i < count; i++) {
            const x = p.width * 0.5 + p.cos(t * params.speed + i * 0.8) * p.width * 0.3 * p.sin(i * 0.3);
            const y = p.height * 0.5 + p.sin(t * params.speed * 0.7 + i * 1.1) * p.height * 0.3 * p.cos(i * 0.4);
            pts.push({ x, y });
            p.noStroke();
            p.fill(params.hue, params.sat, params.bri, params.alpha * 40);
            p.circle(x, y, 3);
        }
        // connections
        p.stroke(params.hue, params.sat, params.bri, params.alpha * 12);
        p.strokeWeight(0.5);
        for (let i = 0; i < pts.length; i++) {
            for (let j = i + 1; j < pts.length; j++) {
                const d = p.dist(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
                if (d < 150) {
                    p.line(pts[i].x, pts[i].y, pts[j].x, pts[j].y);
                }
            }
        }
    }

    function drawRings(p, t, params) {
        p.noFill();
        const cx = p.width / 2;
        const cy = p.height / 2;
        for (let i = 0; i < 8; i++) {
            const r = 50 + i * 40 + p.sin(t * params.speed + i * 0.5) * 20;
            const wobble = p.noise(i * 0.5, t * params.speed) * 30;
            p.stroke(params.hue + i * 5, params.sat, params.bri, params.alpha * 15);
            p.strokeWeight(1);
            p.beginShape();
            for (let a = 0; a < p.TWO_PI; a += 0.1) {
                const rr = r + p.sin(a * 3 + t * 2) * wobble;
                p.vertex(cx + p.cos(a) * rr, cy + p.sin(a) * rr);
            }
            p.endShape(p.CLOSE);
        }
    }

    function drawGlitch(p, t, params) {
        // Horizontal glitch bars
        for (let i = 0; i < 8; i++) {
            const y = p.random(p.height);
            const h = p.random(1, 6);
            const offset = p.random(-30, 30) * (p.noise(t * 5, i) - 0.5) * 2;
            p.noStroke();
            p.fill(params.hue + p.random(-20, 20), params.sat, params.bri, params.alpha * 20);
            p.rect(offset, y, p.width, h);
        }
        // Scattered particles
        p.noStroke();
        for (let i = 0; i < 15; i++) {
            const x = p.random(p.width);
            const y = p.random(p.height);
            const s = p.random(2, 6);
            p.fill(params.hue, params.sat, params.bri, p.random(5, 25));
            p.rect(x, y, s, s * p.random(0.2, 3));
        }
    }

    function drawConstellation(p, t, params) {
        const count = 30;
        p.noStroke();
        for (let i = 0; i < count; i++) {
            const seed = i * 100;
            const x = (p.noise(seed, t * params.speed * 0.3) * 1.4 - 0.2) * p.width;
            const y = (p.noise(seed + 50, t * params.speed * 0.3) * 1.4 - 0.2) * p.height;
            const s = 1 + p.sin(t * 2 + i) * 0.8;
            const a = (0.1 + p.sin(t + i * 0.5) * 0.08) * params.alpha * 50;
            p.fill(params.hue + p.sin(i * 0.3) * 15, params.sat * 0.5, params.bri, a);
            p.circle(x, y, s + 1);
            // occasional bright star
            if (i % 7 === 0) {
                p.fill(params.hue, params.sat * 0.3, 100, a * 1.5);
                p.circle(x, y, s * 0.5);
            }
        }
    }

    function getSceneParams(scene) {
        const presets = {
            room:       { style: 'flow',         hue: 35,  sat: 40, bri: 50, speed: 0.5, force: 0.8, alpha: 0.5, sizeMul: 1.0 },
            chat:       { style: 'network',       hue: 210, sat: 30, bri: 55, speed: 0.6, force: 0.5, alpha: 0.6, sizeMul: 0.8 },
            history:    { style: 'rings',          hue: 25,  sat: 50, bri: 45, speed: 0.3, force: 0.6, alpha: 0.5, sizeMul: 1.2 },
            cosmic:     { style: 'constellation',  hue: 270, sat: 40, bri: 60, speed: 0.4, force: 0.3, alpha: 0.7, sizeMul: 0.6 },
            quantum:    { style: 'flow',           hue: 200, sat: 35, bri: 55, speed: 0.8, force: 1.2, alpha: 0.5, sizeMul: 0.7 },

    function renderAsciiArt(name) {
        const piece = asciiArt[name];
        if (!piece) return null;
        const el = document.createElement('pre');
        el.className = 'ascii-art ' + (piece.theme || '');
        el.textContent = piece.art;
        return el;
    }

    // Detect which ASCII art to show from story text
    function detectAsciiArt(text) {
        const t = text.toLowerCase();
        // Check for explicit tags first: [art: name]
        const tagMatch = text.match(/\[art:\s*(\w+)\]/i);
        if (tagMatch && asciiArt[tagMatch[1]]) return tagMatch[1];

        // Auto-detect from content
        if (t.includes('laptop') || t.includes('screen flickers') || t.includes('apartment')) return 'desk';
        if (t.includes('river city') || t.includes('market') || t.includes('streets')) return 'city';
        if (t.includes('temple') || t.includes('chant-master') || t.includes('granar')) return 'temple';
        if (t.includes('meshwork') || t.includes('network') || t.includes('surplus flow')) return 'network';
        if (t.includes('neganthropomorph') || t.includes('perpendicular') || t.includes('signal from')) return 'signal';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) return 'crisis';
        if (t.includes('cosmic') && (t.includes('awareness') || t.includes('dream'))) return 'signal';
        if (t.includes('agent') && t.includes('outputs')) return 'agent';
        if (t.includes('agent') && (t.includes('dream') || t.includes('strange') || t.includes('anomal'))) return 'agent_anomaly';
        return null;
    }

    // Track last shown art to avoid repetition
    let lastArt = '';

    // ===== SCENE DETECTION =====
    // Priority 1: ink tags (# scene:name)
    // Priority 2: text keyword fallback
    function setSceneFromTags(tags) {
        for (const tag of tags) {
            const sceneMatch = tag.match(/^scene:(\w+)$/);
            if (sceneMatch) {
                const name = sceneMatch[1];
                if (name !== currentScene) {
                    currentScene = name;
                    sceneEl.className = 'scene-' + name;
                    if (window.setP5Scene) window.setP5Scene(name);
                    window._currentScene = name;
                    if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
                        window.playSceneMusic(name);
                    }
                }
                return true;
            }
        }
        return false;
    }

    function processSfxTags(tags) {
        for (const tag of tags) {
            const sfxMatch = tag.match(/^sfx:(\w+)$/);
            if (sfxMatch && window.playSfx) {
                window.playSfx(sfxMatch[1]);
            }
        }
    }

    function setScene(text) {
        const t = text.toLowerCase();
        let name = 'room';
        if (t.includes('crisis') || t.includes('derailing') || t.includes('rupture')) name = 'crisis';
        else if (t.includes('cosmic') || t.includes('neganthropomorph') || t.includes('perpendicular')) name = 'cosmic';
        else if (t.includes('quantum') || t.includes('telepathy') || t.includes('psionic') || t.includes('magick')) name = 'quantum';
        else if (t.includes('river city') || t.includes('granar') || t.includes('temple') || t.includes('chant-master') ||
                 t.includes('feudal') || t.includes('colonial') || t.includes('teotihuacan')) name = 'history';
        else if (t.includes('chat') || t.includes('agent') || t.includes('output') || t.includes('prompt')) name = 'chat';

        if (name === currentScene) return;
        currentScene = name;
        sceneEl.className = 'scene-' + name;

        // Update p5.js generative visuals to match
        if (window.setP5Scene) window.setP5Scene(name);

        // Update dynamic music to match scene
        window._currentScene = name;
        if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
            window.playSceneMusic(name);
        }
    }

    // ===== RENDER STORY =====
    function renderStory() {
        let paragraphs = [];
        let allTags = [];
        while (story.canContinue) {
            let text = story.Continue();
            if (text && text.trim()) paragraphs.push(text.trim());
            // Collect ink tags
            if (story.currentTags && story.currentTags.length > 0) {
                allTags.push(...story.currentTags);
            }
        }

        if (paragraphs.length === 0) {
            if (story.currentChoices.length > 0) showChoices();
            else if (!story.canContinue) showEnding();
            return;
        }

        // Process SFX tags first (e.g., # sfx:companion, # sfx:ending_resolve)
        const fullText = paragraphs.join(' ');
        if (allTags.length > 0) {
            processSfxTags(allTags);
            // Scene detection: try ink tags first, fall back to text keywords
            if (!setSceneFromTags(allTags)) {
                setScene(fullText);
            }
        } else {
            // Fallback to text keyword detection
            setScene(fullText);
        }

        // ASCII art detection
        const artName = detectAsciiArt(fullText);
        if (artName && artName !== lastArt) {
            lastArt = artName;
            const artEl = renderAsciiArt(artName);
            if (artEl) storyContent.appendChild(artEl);
        }

        // Build section
        const section = document.createElement('div');
        section.className = 'story-section';

        paragraphs.forEach(p => {
            // Section headers (-- TITLE --)
            const headerMatch = p.match(/^--\s*(.+?)\s*--$/);
            if (headerMatch) {
                const hdr = document.createElement('div');
                hdr.className = 'section-header';
                hdr.textContent = headerMatch[1];
                section.appendChild(hdr);
                return;
            }

            // Agent dialogue (quoted)
            if (p.startsWith('"') && p.endsWith('"') && p.length > 30) {
                const el = document.createElement('p');
                el.className = 'agent-text';
                el.textContent = p.slice(1, -1);
                section.appendChild(el);
                addToLog('the agent', p.slice(1, -1));
                return;
            }

            // Player/narrator text
            const el = document.createElement('p');
            el.className = 'narrator-text';
            el.textContent = p;
            section.appendChild(el);
            addToLog('', p);
        });

        storyContent.appendChild(section);

        // Feed game variables to music modulation after each story beat
        if (window.applyGameModulation) {
            try { window.applyGameModulation(story.variablesState); } catch(e) {}
        }

        // Scroll to the start of the new section
        requestAnimationFrame(() => {
            scrollToElement(section);
        });

        // Show choices if available
        if (story.currentChoices.length > 0) {
            showChoices();
        } else if (!story.canContinue) {
            showEnding();
        }
    }

    // ===== CHOICES =====
    function showChoices() {
        choicesInner.innerHTML = '';
        choicesArea.classList.add('open');
        updateScrollHint();

        story.currentChoices.forEach((choice, i) => {
            const card = document.createElement('div');
            card.className = 'choice-card';
            card.innerHTML = `<span class="choice-text">${choice.text}</span><span class="choice-index">&rarr;</span>`;
            card.addEventListener('click', () => {
                choicesArea.classList.remove('open');
                // Play choice SFX
                if (window.playSfx) window.playSfx('choice');
                story.ChooseChoiceIndex(i);
                addToLog('You', choice.text);

                // Show player's choice in story
                const choiceSection = document.createElement('div');
                choiceSection.className = 'story-section';
                const el = document.createElement('p');
                el.className = 'player-text';
                el.style.color = 'var(--accent)';
                el.textContent = '> ' + choice.text;
                choiceSection.appendChild(el);
                storyContent.appendChild(choiceSection);

                setTimeout(() => {
                    renderStory();
                }, 150);
            });
            choicesInner.appendChild(card);
        });

        // Scroll so new text before choices is visible
        requestAnimationFrame(() => {
            const lastSection = storyContent.lastElementChild;
            if (lastSection) scrollToElement(lastSection);
        });
    }

    // ===== ENDING =====
    function showEnding() {
        endingReached = true;

        // Switch to ending scene music
        window._currentScene = 'ending';
        if (window.playSceneMusic && typeof audioPlaying !== 'undefined' && audioPlaying) {
            window.playSceneMusic('ending');
        }
        if (window.setP5Scene) window.setP5Scene('ending');
        if (window.playSfx) window.playSfx('ending_resolve');

        // Find ending title from recent log
        const recent = historyLog.slice(-20);
        let title = 'THE END';
        let body = [];

        for (let i = recent.length - 1; i >= 0; i--) {
            const t = recent[i].text.trim();
            if (t === t.toUpperCase() && t.length > 3 && t.length < 60 && !t.includes(':')) {
                title = t;
                break;
            }
            body.unshift(t);
        }
        if (body.length === 0) body = ['The story has ended.'];

        $('ending-title').textContent = title;
        $('ending-body').textContent = body.join(' ').slice(0, 2000);
        $('ending-overlay').classList.add('open');
        sceneEl.className = 'scene-ending';
    }

    // ===== LOG =====
    function addToLog(speaker, text) {
        historyLog.push({ speaker, text });
        const entry = document.createElement('div');
        entry.className = 'log-entry' + (speaker === 'the agent' ? ' agent-entry' : '');
        if (speaker) {
            const tag = document.createElement('div');
            tag.className = 'speaker-tag';
            tag.textContent = speaker;
            entry.appendChild(tag);
        }
        const content = document.createElement('div');
        content.textContent = text;
        entry.appendChild(content);
        historyPanel.appendChild(entry);
    }

    function updateStats() {
        if (!story) return;
        const vars = story.variablesState;
        const chapter = vars.chapter || 1;
        const score = vars.playvolution_score || 0;

        let html = `<h3>Character Sheet</h3>`;
        html += `<div class="stat-chapter-marker">Chapter ${chapter} &middot; Score ${score}</div>`;

        Object.values(statConfig).forEach(sec => {
            html += `<div class="stat-group ${sec.key}">`;
            html += `<div class="stat-group-label">${sec.label}</div>`;
            sec.stats.forEach(stat => {
                try {
                    const raw = vars[stat.id];
                    if (raw !== undefined && raw !== null) {
                        const n = typeof raw === 'number' ? raw : 0;
                        const pct = Math.min(100, Math.max(0, (n / stat.max) * 100));
                        const highClass = (pct >= 70) ? ' stat-high' : '';
                        html += `<div class="stat-row">
                            <span class="stat-name">${stat.name}</span>
                            <span class="stat-right">
                                <span class="stat-value${highClass}">${n}</span>
                                <span class="stat-bar-track"><span class="stat-bar-fill" style="width:${pct}%"></span></span>
                            </span>
                        </div>`;
                    }
                } catch(e) {}
            });
            html += '</div>';
        });
        statsPanel.innerHTML = html;

        // Feed game variables to music modulation engine
        if (window.applyGameModulation) window.applyGameModulation(vars);

        statsOpen = !statsOpen;
        if (statsOpen) { updateStats(); statsPanel.classList.add('open'); }
        else statsPanel.classList.remove('open');
    });

    let logOpen = false;
    $('log-btn').addEventListener('click', () => {
        logOpen = !logOpen;
        if (logOpen) {
            historyPanel.classList.add('open');
            $('history-close').style.display = 'block';
            historyPanel.scrollTop = historyPanel.scrollHeight;
        } else {
            historyPanel.classList.remove('open');
            $('history-close').style.display = 'none';
        }
    });

    $('history-close').addEventListener('click', () => {
        logOpen = false;
        historyPanel.classList.remove('open');
        $('history-close').style.display = 'none';
    });

    // ===== LOAD =====
    async function loadStory() {
        try {
            const resp = await fetch('inkle/story.json');
            if (!resp.ok) throw new Error('Could not load story.json: ' + resp.status);
            const json = await resp.json();
            if (typeof inkjs === 'undefined') throw new Error('inkjs not loaded');
            story = new inkjs.Story(json);
            $('loading-screen').classList.add('hidden');
            setTimeout(() => $('loading-screen').style.display = 'none', 1000);
            renderStory();
        } catch (err) {
            $('loading-screen').textContent = 'Error: ' + err.message;
            console.error(err);
        }
    }

    loadStory();
</script>
</body>
</html>
